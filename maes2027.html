<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Launcher Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw; background: #000; }
        .app-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s; margin: 0 auto 4px; }
        .app-icon:active { transform: scale(0.9); }
        .dock-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s; }
        .dock-icon:active { transform: scale(0.9); }
        .floating-window { position: fixed; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); overflow: hidden; z-index: 40; }
        .floating-window iframe { width: 100%; height: calc(100% - 36px); border: none; }
        .window-controls { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f1f1f1; border-bottom: 1px solid #ddd; height: 36px; }
        .window-controls button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .window-controls button:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const settingsRef = db.collection('launcher_config').doc('settings');
        const appsRef = db.collection('launcher_config').doc('apps');

        // Inicializar datos de ejemplo (solo si no existen)
        const initializeData = async () => {
            const settingsDoc = await settingsRef.get();
            if (!settingsDoc.exists) {
                await settingsRef.set({
                    adminEmail: 'jesusvn1993mplvt3@gmail.com',
                    authorizedEmails: ['jesusvn1993mplvt3@gmail.com', 'fake@example.com'],
                    authEnabled: true, // siempre activa
                    backgrounds: [
                        'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800',
                        'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800',
                        'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800'
                    ],
                    defaultBackground: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800'
                });
                await appsRef.set({
                    items: [
                        { id: '1', name: 'Google', url: 'https://www.google.com', icon: '🔍', iconColor: '#4285F4', visibleTo: [], order: 1 },
                        { id: '2', name: 'YouTube', url: 'https://www.youtube.com', icon: '▶️', iconColor: '#FF0000', visibleTo: [], order: 2 },
                        { id: '3', name: 'GitHub', url: 'https://github.com', icon: '🐙', iconColor: '#333', visibleTo: [], order: 3 },
                        { id: '4', name: 'Admin Panel', url: 'about:blank', icon: '⚙️', iconColor: '#666', visibleTo: ['jesusvn1993mplvt3@gmail.com'], order: 4 }
                    ]
                });
            }
        };

        // ---- Componente principal ----
        const App = () => {
            const [user, setUser] = useState(null);
            const [settings, setSettings] = useState(null);
            const [apps, setApps] = useState([]);
            const [windows, setWindows] = useState([]);
            const [showSettings, setShowSettings] = useState(false);
            const [loading, setLoading] = useState(true);
            const [unauthorized, setUnauthorized] = useState(false);

            useEffect(() => {
                // Inicializar datos (solo si el usuario es admin, pero la llamada es segura)
                initializeData().catch(console.error);

                // Escuchar settings
                const unsubSettings = settingsRef.onSnapshot(doc => {
                    if (doc.exists) setSettings(doc.data());
                    else setSettings(null);
                });

                // Escuchar apps
                const unsubApps = appsRef.onSnapshot(doc => {
                    if (doc.exists && doc.data().items) {
                        setApps(doc.data().items.sort((a, b) => a.order - b.order));
                    } else {
                        setApps([]);
                    }
                });

                // Auth listener
                const unsubAuth = auth.onAuthStateChanged(user => {
                    setUser(user);
                    setLoading(false);
                    if (user) {
                        // Verificar autorización
                        const isAuthorized = settings && (
                            user.email === settings.adminEmail ||
                            (settings.authorizedEmails && settings.authorizedEmails.includes(user.email))
                        );
                        if (!isAuthorized) {
                            setUnauthorized(true);
                        } else {
                            setUnauthorized(false);
                        }
                    } else {
                        setUnauthorized(false);
                    }
                });

                return () => {
                    unsubSettings();
                    unsubApps();
                    unsubAuth();
                };
            }, [settings]); // Dependencia para re-evaluar autorización cuando cambie settings

            const handleGoogleSignIn = async () => {
                try {
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    console.error('Error signing in:', error);
                    alert('Error al iniciar sesión. Asegúrate de tener habilitado el proveedor de Google en Firebase Authentication.');
                }
            };

            const handleSignOut = async () => {
                await auth.signOut();
                setWindows([]);
            };

            const openApp = (app) => {
                if (app.url === 'about:blank') {
                    setShowSettings(true);
                    return;
                }
                const newWindow = {
                    id: Date.now(),
                    appId: app.id,
                    url: app.url,
                    title: app.name,
                    minimized: false,
                    position: null,
                    width: 300,
                    height: 400
                };
                setWindows(prev => organizeWindows([...prev, newWindow]));
            };

            const organizeWindows = (wins) => {
                const baseX = 30, baseY = 80, step = 50;
                const width = 320, height = 420;
                const maxX = window.innerWidth - width - 10;
                const maxY = window.innerHeight - height - 10;
                return wins.map((win, i) => {
                    if (win.position) return win;
                    const x = Math.min(baseX + (i * step) % maxX, maxX);
                    const y = Math.min(baseY + (i * step) % maxY, maxY);
                    return { ...win, position: { x, y }, width, height };
                });
            };

            const closeWindow = (id) => setWindows(prev => prev.filter(w => w.id !== id));
            const minimizeWindow = (id) => setWindows(prev => prev.map(w => w.id === id ? { ...w, minimized: true } : w));
            const maximizeWindow = (id) => setWindows(prev => prev.map(w => w.id === id ? { ...w, minimized: false, position: null } : w));

            const moveWindow = (id, dx, dy) => {
                setWindows(prev => prev.map(w => {
                    if (w.id === id && w.position) {
                        const newX = Math.max(0, Math.min(window.innerWidth - (w.width || 300), w.position.x + dx));
                        const newY = Math.max(0, Math.min(window.innerHeight - (w.height || 400), w.position.y + dy));
                        return { ...w, position: { x: newX, y: newY } };
                    }
                    return w;
                }));
            };

            // Verificar si el usuario actual es admin
            const isAdmin = settings && user && user.email === settings.adminEmail;
            const isAuthorized = settings && user && (
                user.email === settings.adminEmail ||
                (settings.authorizedEmails && settings.authorizedEmails.includes(user.email))
            );

            // Filtrar apps visibles
            const visibleApps = apps.filter(app => {
                if (!app.visibleTo || app.visibleTo.length === 0) return true;
                return user && app.visibleTo.includes(user.email);
            });

            // Estados de carga y autenticación
            if (loading) {
                return <div className="h-screen flex items-center justify-center bg-black text-white text-xl">Cargando...</div>;
            }

            // Si no hay usuario, mostrar login
            if (!user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-black text-white gap-6">
                        <h1 className="text-3xl font-bold">Launcher Pro</h1>
                        <p className="text-gray-400">Inicia sesión con tu cuenta de Google</p>
                        <button onClick={handleGoogleSignIn} className="bg-white text-black px-8 py-4 rounded-xl font-bold text-lg hover:bg-gray-200 transition flex items-center gap-3">
                            <span>🔵</span> Iniciar sesión con Google
                        </button>
                    </div>
                );
            }

            // Si no está autorizado (email no en lista)
            if (unauthorized || !isAuthorized) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-black text-white gap-4">
                        <h1 className="text-2xl font-bold">⛔ Acceso Denegado</h1>
                        <p className="text-gray-400">Tu cuenta no está autorizada para usar este launcher.</p>
                        <button onClick={handleSignOut} className="bg-red-500 text-white px-6 py-3 rounded-lg font-bold">Cerrar sesión</button>
                    </div>
                );
            }

            // ---- Launcher principal ----
            return (
                <div className="h-screen w-screen relative overflow-hidden" style={{
                    backgroundImage: `url(${settings?.defaultBackground || ''})`,
                    backgroundSize: 'cover',
                    backgroundPosition: 'center'
                }}>
                    <div className="absolute inset-0 bg-black/30"></div>

                    <div className="relative z-10 h-full flex flex-col">
                        {/* Grid de apps */}
                        <div className="flex-1 p-4 pt-12 grid grid-cols-4 gap-6 overflow-y-auto content-start">
                            {visibleApps.map(app => (
                                <div key={app.id} className="flex flex-col items-center cursor-pointer" onClick={() => openApp(app)}>
                                    <div className="app-icon" style={{ backgroundColor: app.iconColor }}>{app.icon}</div>
                                    <span className="text-white text-xs font-medium text-center drop-shadow-lg mt-1">{app.name}</span>
                                </div>
                            ))}
                            {/* Configuración solo para admin */}
                            {isAdmin && (
                                <div className="flex flex-col items-center cursor-pointer" onClick={() => setShowSettings(true)}>
                                    <div className="app-icon" style={{ backgroundColor: '#555' }}>⚙️</div>
                                    <span className="text-white text-xs font-medium text-center drop-shadow-lg mt-1">Ajustes</span>
                                </div>
                            )}
                        </div>

                        {/* Dock */}
                        <div className="bg-white/20 backdrop-blur-lg mx-4 mb-4 rounded-3xl py-3 px-6 flex justify-center gap-6">
                            {visibleApps.slice(0, 4).map(app => (
                                <div key={app.id} className="flex flex-col items-center cursor-pointer" onClick={() => openApp(app)}>
                                    <div className="dock-icon" style={{ backgroundColor: app.iconColor }}>{app.icon}</div>
                                </div>
                            ))}
                            {user && (
                                <div className="flex flex-col items-center cursor-pointer" onClick={handleSignOut}>
                                    <div className="dock-icon" style={{ backgroundColor: '#ef4444' }}>🚪</div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Ventanas flotantes */}
                    {windows.map(win => !win.minimized && (
                        <div key={win.id} className="floating-window" style={{
                            left: win.position ? `${win.position.x}px` : '0',
                            top: win.position ? `${win.position.y}px` : '0',
                            width: win.position ? `${win.width}px` : '100vw',
                            height: win.position ? `${win.height}px` : '100vh',
                            borderRadius: win.position ? '12px' : '0',
                        }}>
                            <div className="window-controls" onPointerDown={(e) => {
                                if (e.target.tagName === 'BUTTON') return;
                                const startX = e.clientX, startY = e.clientY;
                                const startLeft = win.position?.x || 0, startTop = win.position?.y || 0;
                                const handleMove = (me) => moveWindow(win.id, me.clientX - startX, me.clientY - startY);
                                const handleUp = () => { window.removeEventListener('pointermove', handleMove); window.removeEventListener('pointerup', handleUp); };
                                window.addEventListener('pointermove', handleMove);
                                window.addEventListener('pointerup', handleUp);
                            }}>
                                <span className="text-xs font-bold truncate">{win.title}</span>
                                <div className="flex gap-1">
                                    <button onClick={() => minimizeWindow(win.id)} title="Minimizar">─</button>
                                    <button onClick={() => maximizeWindow(win.id)} title="Pantalla completa">⛶</button>
                                    <button onClick={() => closeWindow(win.id)} title="Cerrar" className="text-red-500 font-bold">✕</button>
                                </div>
                            </div>
                            {win.url !== 'about:blank' ? (
                                <iframe src={win.url} title={win.title} sandbox="allow-scripts allow-same-origin allow-forms allow-popups" />
                            ) : (
                                <div className="p-4 text-center text-gray-500">Panel de Administración</div>
                            )}
                        </div>
                    ))}

                    {/* Modal de Configuración */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold">⚙️ Configuración</h2>
                                    <button onClick={() => setShowSettings(false)} className="text-2xl hover:bg-gray-100 w-8 h-8 rounded-full">&times;</button>
                                </div>
                                <SettingsPanel settings={settings} apps={apps} onUpdate={() => {}} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ---- Panel de Configuración (solo admin) ----
        const SettingsPanel = ({ settings, apps, onUpdate }) => {
            const [newApp, setNewApp] = useState({ name: '', url: '', icon: '📱', iconColor: '#007AFF', visibleTo: '' });
            const [newBackground, setNewBackground] = useState('');
            const [newUser, setNewUser] = useState('');

            const addApp = async () => {
                if (!newApp.name || !newApp.url) return alert('Nombre y URL son obligatorios');
                const updatedApps = [
                    ...apps,
                    { id: String(Date.now()), ...newApp, visibleTo: newApp.visibleTo ? newApp.visibleTo.split(',').map(e => e.trim()).filter(e => e) : [], order: apps.length + 1 }
                ];
                await appsRef.update({ items: updatedApps });
                setNewApp({ name: '', url: '', icon: '📱', iconColor: '#007AFF', visibleTo: '' });
            };

            const deleteApp = async (appId) => {
                if (!confirm('¿Eliminar esta app?')) return;
                await appsRef.update({ items: apps.filter(a => a.id !== appId) });
            };

            const addBackground = async () => {
                if (!newBackground) return;
                const updated = [...(settings.backgrounds || []), newBackground];
                await settingsRef.update({ backgrounds: updated });
                setNewBackground('');
            };

            const setDefaultBackground = async (url) => {
                await settingsRef.update({ defaultBackground: url });
            };

            const deleteBackground = async (url) => {
                if (!confirm('¿Eliminar este fondo?')) return;
                const updated = (settings.backgrounds || []).filter(b => b !== url);
                const newDefault = settings.defaultBackground === url ? (updated[0] || '') : settings.defaultBackground;
                await settingsRef.update({ backgrounds: updated, defaultBackground: newDefault });
            };

            const addAuthorizedUser = async () => {
                if (!newUser) return;
                if (!newUser.includes('@')) return alert('Ingresa un email válido');
                const updated = [...(settings.authorizedEmails || []), newUser];
                await settingsRef.update({ authorizedEmails: updated });
                setNewUser('');
            };

            const removeAuthorizedUser = async (email) => {
                if (email === settings.adminEmail) return alert('No puedes eliminar al admin principal');
                const updated = (settings.authorizedEmails || []).filter(e => e !== email);
                await settingsRef.update({ authorizedEmails: updated });
            };

            return (
                <div className="space-y-6">
                    {/* Usuarios autorizados */}
                    <section>
                        <h3 className="font-bold text-lg mb-3 border-b pb-2">👥 Usuarios Autorizados</h3>
                        <div className="flex gap-2 mb-3">
                            <input value={newUser} onChange={e => setNewUser(e.target.value)} placeholder="correo@ejemplo.com" className="flex-1 border rounded-lg p-2 text-sm" />
                            <button onClick={addAuthorizedUser} className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Añadir</button>
                        </div>
                        <div className="space-y-1 max-h-32 overflow-y-auto">
                            {(settings?.authorizedEmails || []).map(email => (
                                <div key={email} className="flex items-center justify-between bg-gray-50 p-2 rounded-lg text-sm">
                                    <span>{email}</span>
                                    <div className="flex items-center gap-2">
                                        {email === settings?.adminEmail && <span className="text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 rounded-full font-bold">Admin</span>}
                                        {email !== settings?.adminEmail && <button onClick={() => removeAuthorizedUser(email)} className="text-red-500 hover:text-red-700 text-lg">&times;</button>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Añadir App */}
                    <section>
                        <h3 className="font-bold text-lg mb-3 border-b pb-2">📱 Añadir Aplicación</h3>
                        <div className="grid grid-cols-2 gap-2 mb-3">
                            <input value={newApp.name} onChange={e => setNewApp({...newApp, name: e.target.value})} placeholder="Nombre *" className="border rounded-lg p-2 text-sm" />
                            <input value={newApp.url} onChange={e => setNewApp({...newApp, url: e.target.value})} placeholder="URL *" className="border rounded-lg p-2 text-sm" />
                            <input value={newApp.icon} onChange={e => setNewApp({...newApp, icon: e.target.value})} placeholder="Icono (emoji)" className="border rounded-lg p-2 text-sm" />
                            <input value={newApp.iconColor} onChange={e => setNewApp({...newApp, iconColor: e.target.value})} placeholder="Color (#hex)" className="border rounded-lg p-2 text-sm" />
                            <input value={newApp.visibleTo} onChange={e => setNewApp({...newApp, visibleTo: e.target.value})} placeholder="Visible para (emails separados por coma)" className="border rounded-lg p-2 text-sm col-span-2" />
                        </div>
                        <button onClick={addApp} className="w-full bg-green-500 text-white py-2 rounded-lg text-sm font-bold">Añadir App</button>
                    </section>

                    {/* Apps instaladas */}
                    <section>
                        <h3 className="font-bold text-lg mb-3 border-b pb-2">📋 Apps Instaladas ({apps.length})</h3>
                        <div className="space-y-2 max-h-40 overflow-y-auto">
                            {apps.map(app => (
                                <div key={app.id} className="flex items-center justify-between bg-gray-50 p-2 rounded-lg text-sm">
                                    <div className="flex items-center gap-3">
                                        <span className="text-xl">{app.icon}</span>
                                        <div>
                                            <div className="font-bold">{app.name}</div>
                                            <div className="text-xs text-gray-500 truncate max-w-[200px]">{app.url}</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {app.visibleTo?.length > 0 && <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">Restringida</span>}
                                        <button onClick={() => deleteApp(app.id)} className="text-red-500 hover:text-red-700 text-lg">&times;</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Fondos de pantalla */}
                    <section>
                        <h3 className="font-bold text-lg mb-3 border-b pb-2">🖼️ Fondos de Pantalla</h3>
                        <div className="flex gap-2 mb-3">
                            <input value={newBackground} onChange={e => setNewBackground(e.target.value)} placeholder="URL de imagen" className="flex-1 border rounded-lg p-2 text-sm" />
                            <button onClick={addBackground} className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Añadir</button>
                        </div>
                        <div className="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto">
                            {(settings?.backgrounds || []).map((bg, i) => (
                                <div key={i} className="relative group cursor-pointer" onClick={() => setDefaultBackground(bg)}>
                                    <img src={bg} className="w-full h-24 object-cover rounded-lg" alt={`Fondo ${i + 1}`} />
                                    {bg === settings?.defaultBackground && <div className="absolute top-2 left-2 bg-blue-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">Actual</div>}
                                    <button onClick={(e) => { e.stopPropagation(); deleteBackground(bg); }} className="absolute top-2 right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs opacity-0 group-hover:opacity-100 transition flex items-center justify-center">✕</button>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
