<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Etiquetas QR - CIRINEO</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/jesusvn1993mplvt3-ai/CIRINEO/refs/heads/main/icon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    
    <!-- PDF Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            background-color: #f1f5f9; 
            min-height: 100vh; 
            font-family: 'Roboto Condensed', sans-serif; 
            overflow: hidden; 
        }
        
        @media (max-width: 1024px) { 
            body { 
                height: auto; 
                overflow-y: auto; 
                overflow-x: hidden; 
            } 
        }

        /* --- TAMAÑO EXACTO DE ETIQUETA: 6.5cm x 5cm --- */
        .pdf-fixed-container {
            width: 6.5cm;
            height: 5cm;
            background: white;
            page-break-after: always;
            break-after: page;
            margin: 0;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            display: flex;
            border: 1px solid #ddd;
        }

        .preview-wrapper {
            width: 6.5cm;
            height: 5cm;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background: white;
            border: 2px dashed #94a3b8;
        }

        /* --- ESTRUCTURA DE LA ETIQUETA QR --- */
        .qr-label-layout {
            width: 100%;
            height: 100%;
            display: flex;
            padding: 0.25cm;
            box-sizing: border-box;
            background: white;
        }

        /* Sección QR (4.5x4.5cm con márgenes) */
        .qr-section {
            width: 4.5cm;
            height: 4.5cm;
            padding: 0.25cm;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px dashed #ccc;
        }

        /* Sección del código en vertical */
        .code-section {
            width: 2cm;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5cm 0;
        }

        /* Código en orientación vertical */
        .vertical-code {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            color: #1e293b;
        }

        /* QR canvas */
        .qr-canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 4.5cm;
            max-height: 4.5cm;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Configuración de Firebase (igual que el original)
        const firebaseConfig = {
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409",
            measurementId: "G-B7YLM78RVW"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const FieldValue = firebase.firestore.FieldValue;

        // Componente de ícono
        const Icon = ({ name, size = 18, className }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && lucide.icons[name]) {
                    containerRef.current.innerHTML = lucide.icons[name].toSvg({ 
                        width: size, 
                        height: size, 
                        class: className 
                    });
                }
            }, [name, size, className]);
            return <div ref={containerRef} className="inline-block" style={{ width: size, height: size }}></div>;
        };

        // --- COMPONENTE DE ETIQUETA QR ---
        const QRLabel = ({ labelData }) => {
            const qrRef = useRef(null);
            const order = labelData;
            
            // Usamos el mismo packageCode que en el original
            const qrValue = order.packageCode || `ORD-${order.id}-PKG-${order.packageIndex}`;

            useEffect(() => {
                if (qrRef.current && qrValue) {
                    // Limpiar contenido previo
                    qrRef.current.innerHTML = '';
                    
                    // Generar QR con tamaño específico
                    QRCode.toCanvas(qrRef.current, qrValue, {
                        width: 200,
                        height: 200,
                        margin: 1,
                        color: {
                            dark: '#000000',
                            light: '#FFFFFF'
                        }
                    }, function (error) {
                        if (error) console.error(error);
                    });
                }
            }, [qrValue]);

            return (
                <div className="qr-label-layout">
                    {/* Sección QR (4.5x4.5cm) */}
                    <div className="qr-section">
                        {qrValue ? (
                            <canvas ref={qrRef} className="qr-canvas"></canvas>
                        ) : (
                            <div className="text-slate-400 text-sm text-center">
                                <Icon name="qrcode" size={24} className="mx-auto mb-1" />
                                <span>Sin código</span>
                            </div>
                        )}
                    </div>
                    
                    {/* Sección código vertical */}
                    <div className="code-section">
                        {qrValue && (
                            <div className="vertical-code" title={qrValue}>
                                {qrValue}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- APLICACIÓN PRINCIPAL ---
        const App = () => {
            const [orders, setOrders] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [packageLabels, setPackageLabels] = useState([]);
            const [filterText, setFilterText] = useState('');
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const pdfContainerRef = useRef(null);

            // Cargar órdenes desde Firebase
            useEffect(() => {
                const unsubscribe = db.collection('orders')
                    .where('status', '!=', 'ARCHIVADO')
                    .onSnapshot(snapshot => {
                        const fetchedOrders = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // Ordenar por ID descendente (más recientes primero)
                        fetchedOrders.sort((a, b) => b.id - a.id);
                        setOrders(fetchedOrders);
                    });
                
                return () => unsubscribe();
            }, []);

            // Cuando se selecciona una orden, extraer sus paquetes
            useEffect(() => {
                if (selectedOrder && selectedOrder.progreso) {
                    const labels = selectedOrder.progreso.map(p => ({
                        ...selectedOrder,
                        piezaNombre: p.piezaNombre,
                        packageIndex: p.paqueteNum,
                        totalPackages: p.paquetesDePieza,
                        piecesInPackage: p.cantidad,
                        packageCode: p.codigoUnico, // ¡Este es el código que usaremos para el QR!
                        displayPackageId: `${p.paqueteNum}/${p.paquetesDePieza}`
                    }));
                    setPackageLabels(labels);
                } else {
                    setPackageLabels([]);
                }
            }, [selectedOrder]);

            // Filtrar órdenes
            const filteredOrders = useMemo(() => {
                if (!filterText.trim()) return orders;
                
                const searchTerm = filterText.toUpperCase();
                return orders.filter(order => 
                    (order.codigo && order.codigo.toUpperCase().includes(searchTerm)) ||
                    (order.cliente && order.cliente.toUpperCase().includes(searchTerm)) ||
                    (order.partida && order.partida.toUpperCase().includes(searchTerm))
                );
            }, [orders, filterText]);

            // Generar PDF con todas las etiquetas
            const handleDownloadPDF = async () => {
                if (packageLabels.length === 0) {
                    alert('No hay paquetes para generar etiquetas');
                    return;
                }

                setIsGeneratingPdf(true);

                // Esperar un momento para que se rendericen todos los QR
                await new Promise(resolve => setTimeout(resolve, 500));

                const element = pdfContainerRef.current;
                if (!element) {
                    alert('Error interno: Contenedor PDF no encontrado');
                    setIsGeneratingPdf(false);
                    return;
                }

                const options = {
                    margin: [0.2, 0.2],
                    filename: `etiquetas_qr_${selectedOrder.codigo || 'orden'}.pdf`,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { 
                        scale: 3, // Alta resolución para QR
                        useCORS: true,
                        logging: false
                    },
                    jsPDF: { 
                        unit: 'cm', 
                        format: [6.5, 5], // Tamaño exacto de etiqueta
                        orientation: 'portrait'
                    }
                };

                try {
                    await html2pdf().set(options).from(element).save();
                } catch (error) {
                    console.error('Error generando PDF:', error);
                    alert('Error al generar PDF');
                }

                setIsGeneratingPdf(false);
            };

            return (
                <div className="flex flex-col lg:flex-row h-screen w-full">
                    {/* SIDEBAR - LISTA DE ÓRDENES */}
                    <div className="w-full lg:w-80 bg-slate-800 text-white flex flex-col border-r border-slate-700 shadow-xl shrink-0 h-64 lg:h-auto">
                        <div className="p-4 bg-slate-900 border-b border-slate-700">
                            <h1 className="text-xl font-bold text-yellow-400 tracking-tighter">
                                <Icon name="qrcode" className="inline mr-2" />
                                CIRINEO QR
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Etiquetas 6.5x5cm</p>
                            
                            <input 
                                type="text" 
                                placeholder="Buscar orden..." 
                                value={filterText} 
                                onChange={e => setFilterText(e.target.value)}
                                className="w-full mt-3 bg-slate-800 border border-slate-600 rounded p-2 text-sm placeholder-slate-400"
                            />
                        </div>
                        
                        <div className="flex-grow overflow-y-auto p-2 space-y-2">
                            {filteredOrders.length > 0 ? (
                                filteredOrders.map(order => (
                                    <div 
                                        key={order.id} 
                                        onClick={() => setSelectedOrder(order)}
                                        className={`p-3 rounded cursor-pointer border-l-4 transition-all ${
                                            selectedOrder?.id === order.id 
                                                ? 'bg-slate-700 border-yellow-400' 
                                                : 'bg-slate-800/50 border-transparent hover:bg-slate-700'
                                        }`}
                                    >
                                        <div className="font-bold text-sm flex justify-between">
                                            <span>{order.codigo || 'SIN CÓDIGO'}</span>
                                            {order.progreso && (
                                                <span className="text-xs bg-blue-500 px-2 py-1 rounded">
                                                    {order.progreso.length} pqt
                                                </span>
                                            )}
                                        </div>
                                        <div className="text-xs text-slate-400 mt-1">{order.cliente || 'Sin cliente'}</div>
                                        <div className="text-xs text-slate-500 mt-1">
                                            Partida: {order.partida || '-'} • Total: {order.totalPedido || 0}
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div className="p-4 text-center text-slate-400">
                                    <Icon name="inbox" size={32} className="mx-auto mb-2 opacity-50" />
                                    <p>No hay órdenes activas</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* CONTENIDO PRINCIPAL */}
                    <div className="flex-grow bg-slate-100 flex flex-col relative overflow-hidden">
                        {/* Header */}
                        <div className="bg-white p-4 shadow-sm border-b flex justify-between items-center">
                            <div>
                                <h2 className="font-bold text-slate-700 text-lg">
                                    {selectedOrder 
                                        ? `${selectedOrder.codigo} - ${packageLabels.length} ETIQUETAS QR` 
                                        : 'Seleccione una orden'
                                    }
                                </h2>
                                {selectedOrder && (
                                    <div className="text-sm text-slate-600 mt-1">
                                        Cliente: {selectedOrder.cliente} • 
                                        Partida: {selectedOrder.partida} • 
                                        Total orden: {selectedOrder.totalPedido}
                                    </div>
                                )}
                            </div>
                            
                            {selectedOrder && packageLabels.length > 0 && (
                                <button
                                    onClick={handleDownloadPDF}
                                    disabled={isGeneratingPdf}
                                    className={`px-5 py-2.5 text-white rounded-lg font-bold flex items-center gap-2 shadow-lg ${
                                        isGeneratingPdf 
                                            ? 'bg-slate-400 cursor-not-allowed' 
                                            : 'bg-red-600 hover:bg-red-700'
                                    }`}
                                >
                                    <Icon name="file-down" size={18} />
                                    {isGeneratingPdf ? 'GENERANDO PDF...' : 'DESCARGAR PDF'}
                                </button>
                            )}
                        </div>

                        {/* VISTA PREVIA */}
                        <div className="flex-grow overflow-y-auto p-4 lg:p-8 flex flex-col items-center">
                            {packageLabels.length > 0 ? (
                                <>
                                    <div className="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">
                                        VISTA PREVIA (1 de {packageLabels.length})
                                    </div>
                                    <div className="preview-wrapper">
                                        <QRLabel labelData={packageLabels[0]} />
                                    </div>
                                    
                                    <div className="mt-6 text-center max-w-md">
                                        <div className="bg-white p-4 rounded-lg border border-slate-200">
                                            <h3 className="font-bold text-slate-800 mb-2">Información del paquete</h3>
                                            <div className="grid grid-cols-2 gap-3 text-sm">
                                                <div>
                                                    <span className="text-slate-600">Pieza:</span>
                                                    <div className="font-bold">{packageLabels[0].piezaNombre || 'N/A'}</div>
                                                </div>
                                                <div>
                                                    <span className="text-slate-600">Paquete:</span>
                                                    <div className="font-bold">{packageLabels[0].displayPackageId}</div>
                                                </div>
                                                <div>
                                                    <span className="text-slate-600">Cantidad:</span>
                                                    <div className="font-bold">{packageLabels[0].piecesInPackage} pzas</div>
                                                </div>
                                                <div>
                                                    <span className="text-slate-600">Código:</span>
                                                    <div className="font-mono text-xs truncate" title={packageLabels[0].packageCode}>
                                                        {packageLabels[0].packageCode}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <p className="text-slate-500 text-sm mt-4">
                                            Cada etiqueta mide <strong>6.5cm × 5cm</strong>. 
                                            El QR ocupa <strong>4.5cm × 4.5cm</strong> y el código se muestra en vertical.
                                        </p>
                                        <p className="text-xs text-blue-600 mt-2">
                                            Se generarán {packageLabels.length} etiquetas en el PDF, una por cada paquete.
                                        </p>
                                    </div>
                                </>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                                    {selectedOrder ? (
                                        <>
                                            <Icon name="alert-circle" size={48} className="mb-3 opacity-50" />
                                            <p>Esta orden no tiene paquetes generados</p>
                                            <p className="text-sm mt-2">Los paquetes aparecerán en "progreso"</p>
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="package" size={48} className="mb-3 opacity-50" />
                                            <p>Selecciona una orden del menú lateral</p>
                                            <p className="text-sm mt-2">Se mostrarán las etiquetas QR de sus paquetes</p>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* CONTENEDOR OCULTO PARA PDF */}
                    <div style={{
                        position: 'absolute',
                        top: 0,
                        left: '-9999px',
                        width: '6.5cm'
                    }}>
                        <div ref={pdfContainerRef}>
                            {packageLabels.map((labelData, index) => (
                                <div key={index} className="pdf-fixed-container">
                                    <QRLabel labelData={labelData} />
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* PANEL LATERAL DERECHO - INFO */}
                    <div className="w-full lg:w-64 bg-white border-l border-slate-200 shadow-xl z-20 shrink-0 hidden lg:flex flex-col">
                        <div className="p-4 bg-slate-50 border-b">
                            <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                <Icon name="info" />
                                Información
                            </h3>
                        </div>
                        <div className="p-4 flex-grow">
                            <div className="space-y-4">
                                <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                    <h4 className="font-bold text-blue-800 text-sm flex items-center gap-2">
                                        <Icon name="qrcode" size={16} />
                                        Especificaciones
                                    </h4>
                                    <ul className="text-xs text-blue-700 mt-2 space-y-1">
                                        <li>• Tamaño: 6.5cm × 5cm</li>
                                        <li>• QR: 4.5cm × 4.5cm</li>
                                        <li>• Código en vertical</li>
                                        <li>• 0.5cm márgenes</li>
                                    </ul>
                                </div>
                                
                                <div className="bg-amber-50 p-3 rounded-lg border border-amber-100">
                                    <h4 className="font-bold text-amber-800 text-sm flex items-center gap-2">
                                        <Icon name="database" size={16} />
                                        Datos desde Firebase
                                    </h4>
                                    <p className="text-xs text-amber-700 mt-2">
                                        Las etiquetas usan el código único de cada paquete almacenado en la base de datos.
                                    </p>
                                </div>
                                
                                {selectedOrder && (
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <h4 className="font-bold text-slate-800 text-sm">Orden seleccionada</h4>
                                        <div className="text-xs text-slate-600 mt-2 space-y-1">
                                            <div><strong>Código:</strong> {selectedOrder.codigo}</div>
                                            <div><strong>Cliente:</strong> {selectedOrder.cliente}</div>
                                            <div><strong>Partida:</strong> {selectedOrder.partida || 'N/A'}</div>
                                            <div><strong>Paquetes:</strong> {packageLabels.length}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Renderizar la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
