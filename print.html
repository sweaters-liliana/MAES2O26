<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Textil Cloud - Cirineo v4.4 (Print Updated)</title>
    
    <link id="appIcon" rel="icon" href="https://raw.githubusercontent.com/jesusvn1993mplvt3-ai/CIRINEO/refs/heads/main/icon.ico">
    <meta name="theme-color" content="#1e293b">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* --- ESTILOS DE IMPRESIÓN --- */
        @media print {
            body, html, #root { 
                background: white;
                -webkit-print-color-adjust: exact; 
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .no-print, .dashboard-grid { display: none !important; }
        }

        [span_0](start_span)[span_1](start_span)[span_2](start_span)/* DISEÑO DE HOJA CARTA BASADO EN PAPELETAS[span_0](end_span)[span_1](end_span)[span_2](end_span) */
        @media print {
            body:not(.print-mode-ticket) @page { size: letter portrait; margin: 0.5cm; }
            body:not(.print-mode-ticket) .print-visible-wrapper { display: block !important; width: 100% !important; }
            
            /* Contenedor Principal (Estilo Papeleta pero en Grande) */
            .letter-order-container {
                border: 4px solid black;
                border-radius: 12px;
                padding: 0;
                font-family: sans-serif;
                color: black;
                overflow: hidden;
            }

            .order-header-row {
                display: flex;
                border-bottom: 3px solid black;
            }

            .order-cell {
                flex: 1;
                padding: 6px 10px;
                border-right: 3px solid black;
                display: flex;
                flex-direction: column;
            }

            .order-cell:last-child { border-right: none; }

            .order-label {
                font-size: 10pt;
                font-weight: 800;
                text-transform: uppercase;
                color: #222;
                margin-bottom: 2px;
            }

            .order-value {
                font-size: 18pt;
                font-weight: 900;
                text-transform: uppercase;
                line-height: 1.1;
            }

            .order-value.xl { font-size: 28pt; }
            .order-value.huge-mq { font-size: 80pt; color: #dc2626; text-align: center; line-height: 1; }

            /* Tabla de Piezas Estilo Papeleta */
            .pieces-grid {
                width: 100%;
                border-collapse: collapse;
            }
            .pieces-grid th {
                background: #e2e8f0 !important;
                border: 2px solid black;
                padding: 8px;
                font-size: 11pt;
                font-weight: 900;
                text-align: left;
            }
            .pieces-grid td {
                border: 2px solid black;
                padding: 8px;
                font-size: 14pt;
                font-weight: 800;
            }

            .barcode-footer {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 15px;
                border-top: 3px solid black;
            }
        }

        [span_3](start_span)[span_4](start_span)[span_5](start_span)/* Mantenimiento de Estilos Originales de Papeletas[span_3](end_span)[span_4](end_span)[span_5](end_span) */
        @media print {
            body.print-mode-ticket @page { size: 6in 4in landscape; margin: 0; }
            body.print-mode-ticket .ticket-container { 
                display: flex !important; width: 6in; height: 4in; page-break-after: always; padding: 5px; 
            }
            .ticket-content { width: 100%; height: 100%; border: 3px solid black; border-radius: 8px; display: flex; flex-direction: column; }
            .ticket-row { display: flex; border-bottom: 2px solid black; }
            .ticket-col { flex: 1; padding: 2px 4px; border-right: 2px solid black; display: flex; flex-direction: column; justify-content: center; }
            .ticket-label { font-size: 8pt; font-weight: bold; text-transform: uppercase; }
            .ticket-value { font-size: 12pt; font-weight: 900; text-transform: uppercase; }
        }

        /* General Dash Styles */
        .dashboard-grid { display: grid; grid-template-rows: 60vh 1fr; height: 100vh; overflow: hidden; }
        .top-pane { overflow-y: auto; border-bottom: 4px solid #334155; }
        .bottom-pane { overflow-x: auto; background: #1e293b; color: white; display: flex; padding: 10px; gap: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409",
            measurementId: "G-B7YLM78RVW"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const Icon = ({ name, size = 18, className }) => <i data-lucide={name} width={size} height={size} className={className}></i>;

        // --- COMPONENTE ORDEN DE PRODUCCIÓN TAMAÑO CARTA (DISEÑO ADAPTADO A PAPELETA) ---
        const ProductionOrderPrint = ({ order }) => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                if (canvasRef.current && order.id) {
                    try { JsBarcode(canvasRef.current, order.id, { format: "CODE128", displayValue: false, height: 60 }); } 
                    catch (e) { console.error("Error barcode", e); }
                }
            }, [order]);

            return (
                <div className="print-visible-wrapper hidden p-4">
                    <div className="letter-order-container">
                        {/* Cabecera Tipo Papeleta */}
                        <div className="order-header-row bg-slate-50">
                            <div className="order-cell" style={{flex: 3}}>
                                <span className="order-label">CLIENTE</span>
                                <span className="order-value xl">{order.cliente}</span>
                            </div>
                            <div className="order-cell" style={{flex: 2}}>
                                <span className="order-label">FECHA DE EMISIÓN</span>
                                <span className="order-value">{new Date().toLocaleDateString('es-MX')}</span>
                            </div>
                        </div>

                        <div className="order-header-row">
                            <div className="order-cell" style={{flex: 2}}>
                                <span className="order-label">MODELO / CÓDIGO</span>
                                <span className="order-value xl">{order.codigo}</span>
                            </div>
                            <div className="order-cell" style={{flex: 1}}>
                                <span className="order-label">PARTIDA</span>
                                <span className="order-value xl">{order.partida}</span>
                            </div>
                            <div className="order-cell" style={{flex: 1.5}}>
                                <span className="order-label">MAQUINA</span>
                                <div className="order-value huge-mq">{order.maquina}</div>
                            </div>
                        </div>

                        {/* Detalle de Hilos */}
                        <div className="p-4 border-b-3 border-black bg-indigo-50">
                            <span className="order-label block mb-2">ESPECIFICACIONES DE ENHEBRADO</span>
                            <div className="grid grid-cols-4 gap-4">
                                {order.threading?.map((h, i) => (
                                    <div key={i} className="border-l-4 border-indigo-600 pl-2">
                                        <div className="text-[10pt] font-bold">GUÍA {h.guia}</div>
                                        <div className="text-[12pt] font-black">{h.material || 'N/A'}</div>
                                        <div className="text-[11pt] text-indigo-700">{h.porcentaje}%</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Tabla de Componentes Adaptada */}
                        <div className="p-0">
                            <table className="pieces-grid">
                                <thead>
                                    <tr>
                                        <th>PIEZA / DESCRIPCIÓN</th>
                                        <th className="text-center">TALLA</th>
                                        <th className="text-center">PESO (G)</th>
                                        <th className="text-center">TIEMPO (M:S)</th>
                                        <th className="text-center">CANT. TOTAL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {order.subPiecesData?.map((p, idx) => (
                                        <tr key={idx}>
                                            <td>{p.pieza}</td>
                                            <td className="text-center font-black text-2xl">{p.talla || '-'}</td>
                                            <td className="text-center">{p.peso}g</td>
                                            <td className="text-center">
                                                {Math.floor(p.tiempo)}:{( (p.tiempo % 1) * 60).toFixed(0).padStart(2, '0')}
                                            </td>
                                            <td className="text-center bg-yellow-50">{p.totalPedido}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Footer con Código de Barras */}
                        <div className="barcode-footer">
                            <canvas ref={canvasRef}></canvas>
                            <div className="text-sm font-mono mt-1">NÚMERO DE ORDEN: {order.id}</div>
                            <div className="mt-4 w-full flex justify-between px-10">
                                <div className="text-center border-t-2 border-black w-48 pt-1 text-xs font-bold">FIRMA PROGRAMACIÓN</div>
                                <div className="text-center border-t-2 border-black w-48 pt-1 text-xs font-bold">FIRMA PRODUCCIÓN</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PAPELETA INDIVIDUAL (Sin cambios, para referencia) ---
        const PackageTicket = ({ order, pkg }) => {
            const canvasRef = useRef(null);
            const pieceInfo = order.subPiecesData?.find(p => p.pieza === pkg.piezaNombre) || {};

            useEffect(() => {
                if (canvasRef.current) {
                    const barcodeValue = `${order.id}-${pkg.id}`;
                    try { JsBarcode(canvasRef.current, barcodeValue, { format: "CODE128", displayValue: false, height: 50, width: 2, margin: 0, background: "transparent" }); } 
                    catch (e) { console.error("Error barcode", e); }
                }
            }, [order, pkg]);

            return (
                <div className="ticket-container">
                    <div className="ticket-content">
                        <div className="ticket-row">
                            <div className="ticket-col" style={{flex: 2}}><span className="ticket-label">MODELO</span><span className="ticket-value">{order.codigo}</span></div>
                            <div className="ticket-col" style={{flex: 1}}><span className="ticket-label">PIEZAS</span><span className="ticket-value text-center">{pkg.cantidad}</span></div>
                            <div className="ticket-col" style={{flex: 2}}><span className="ticket-label">PARTIDA</span><span className="ticket-value">{order.partida}</span></div>
                        </div>
                        <div className="ticket-row" style={{padding: '4px'}}>
                            <div className="ticket-col border-r-0"><span className="ticket-label">DESCRIPCION</span><span className="ticket-value">{pkg.piezaNombre}</span></div>
                        </div>
                        <div className="ticket-row" style={{flex: '1 1 auto'}}>
                            <div className="ticket-col text-center" style={{flex: 1}}><span className="ticket-label">PAQUETE</span><span className="ticket-value text-3xl">{pkg.paqueteNum} / {pkg.paquetesDePieza}</span></div>
                            <div className="ticket-col text-center bg-slate-100" style={{flex: 1}}><span className="ticket-label">MAQUINA</span><span className="ticket-value text-5xl">{order.maquina}</span></div>
                        </div>
                        <div className="ticket-row no-border-bottom flex-col items-center justify-center pt-2">
                            <canvas ref={canvasRef} className="max-w-full"></canvas>
                            <div className="text-[9px] font-mono mt-1">ID: {order.id}-{pkg.id}</div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL (Lógica de selección de impresión) ---
        const App = () => {
            const [orders, setOrders] = useState([]);
            const [printMode, setPrintMode] = useState(null); // 'order' o 'tickets'
            const [selectedOrder, setSelectedOrder] = useState(null);

            useEffect(() => {
                const unsubscribe = db.collection('orders').onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setOrders(data);
                });
                return () => unsubscribe();
            }, []);

            const handlePrintOrder = (order) => {
                setSelectedOrder(order);
                setPrintMode('order');
                document.body.classList.remove('print-mode-ticket');
                setTimeout(() => { window.print(); }, 500);
            };

            const handlePrintTickets = (order) => {
                setSelectedOrder(order);
                setPrintMode('tickets');
                document.body.classList.add('print-mode-ticket');
                setTimeout(() => { window.print(); }, 500);
            };

            return (
                <div className="min-h-screen">
                    <div className="no-print p-6">
                        <h1 className="text-2xl font-black mb-6">CIRINEO - GESTIÓN DE PRODUCCIÓN</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {orders.map(order => (
                                <div key={order.id} className="bg-white border-2 border-slate-300 p-4 rounded-xl shadow-lg">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <div className="text-xs font-bold text-slate-400">PARTIDA: {order.partida}</div>
                                            <div className="text-xl font-black">{order.codigo}</div>
                                            <div className="text-sm text-slate-600 uppercase font-bold">{order.cliente}</div>
                                        </div>
                                        <div className="bg-indigo-600 text-white px-3 py-1 rounded-lg text-2xl font-black">
                                            M{order.maquina}
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => handlePrintOrder(order)} className="flex-1 bg-slate-800 text-white py-2 rounded font-bold hover:bg-black transition-colors">
                                            <Icon name="file-text" className="inline mr-2"/> Hoja Carta
                                        </button>
                                        <button onClick={() => handlePrintTickets(order)} className="flex-1 bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700 transition-colors">
                                            <Icon name="tag" className="inline mr-2"/> Papeletas
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ZONA DE IMPRESIÓN DINÁMICA */}
                    {printMode === 'order' && selectedOrder && <ProductionOrderPrint order={selectedOrder} />}
                    {printMode === 'tickets' && selectedOrder && (
                        <div className="print-visible-wrapper hidden">
                            {selectedOrder.predefinedPackages?.map(pkg => (
                                <PackageTicket key={pkg.id} order={selectedOrder} pkg={pkg} />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
