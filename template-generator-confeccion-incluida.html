<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Factory - Módulo Confección</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* Estilos Oscuros (Dark Mode Nativo) */
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #db2777; border-radius: 4px; } /* Scroll rosa para diferenciar */
        input:focus, select:focus { outline: 2px solid #db2777; outline-offset: 1px; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Clases personalizadas */
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-dark { background: #020617; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 0.375rem; width: 100%; font-size: 0.875rem; transition: border-color 0.2s; text-transform: uppercase; font-weight: 600; }
        .input-dark:focus { border-color: #f472b6; }
        .btn-action { background: #be185d; color: white; font-weight: bold; border-radius: 0.5rem; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; justify-content: center; }
        .btn-action:hover { background: #9d174d; transform: translateY(-1px); }
        .tag-btn { font-size: 0.7rem; padding: 0.25rem 0.5rem; border-radius: 9999px; border: 1px solid #334155; transition: all 0.15s; user-select: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. CONFIGURACIÓN FIREBASE (Tu configuración real) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Icon Helper
        const Icon = ({ name, size = 18, className }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- COMPONENTE PRINCIPAL: GESTOR DE CONFECCIÓN ---
        const ConfectionManager = () => {
            // Estado Principal
            const [modelo, setModelo] = useState('');
            const [isLoaded, setIsLoaded] = useState(false);
            const [loading, setLoading] = useState(false);
            
            // Datos de la ruta de confección
            const [processes, setProcesses] = useState([]);

            // Datos Auxiliares (Base de Datos)
            const [employees, setEmployees] = useState([]); // Lista Empleados
            const [resources, setResources] = useState([]); // Lista Máquinas/Otros
            const [processLibrary, setProcessLibrary] = useState([]); // Memoria de procesos aprendidos

            // Estado para sugerencias de autocompletado
            const [suggestions, setSuggestions] = useState({ index: null, items: [] });

            // 1. Cargar Datos Globales al inicio
            useEffect(() => {
                // Escuchar empleados activos
                const unsubEmp = db.collection('confection_employees').where('status', '==', 'ACTIVE').onSnapshot(snap => {
                    setEmployees(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                // Escuchar recursos (Máquinas, etc.)
                const unsubRes = db.collection('settings_resources').onSnapshot(snap => {
                    setResources(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                // Escuchar biblioteca de procesos (Memoria)
                const unsubProc = db.collection('settings_processes').orderBy('lastUsed', 'desc').limit(50).onSnapshot(snap => {
                    setProcessLibrary(snap.docs.map(d => d.data()));
                });

                return () => { unsubEmp(); unsubRes(); unsubProc(); };
            }, []);

            // 2. Función: Cargar Modelo existente (Conexión con BD)
            const loadModelData = async () => {
                if (!modelo.trim()) return alert("Por favor escribe un modelo.");
                setLoading(true);
                try {
                    const docRef = db.collection('model_templates').doc(modelo.toUpperCase().trim());
                    const docSnap = await docRef.get();

                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.confection && data.confection.length > 0) {
                            setProcesses(data.confection);
                            // Notificación sutil
                            console.log("Datos de confección cargados.");
                        } else {
                            // Existe el modelo (quizá solo tejeduría) pero no confección
                            setProcesses([{ descripcion: '', tipo: 'MAQUINA', recurso: '', operarios: [], precio: '' }]);
                        }
                    } else {
                        // No existe nada, empezamos de cero
                        if(confirm(`El modelo "${modelo.toUpperCase()}" no existe en la base de datos. ¿Deseas crearlo ahora?`)) {
                            setProcesses([{ descripcion: '', tipo: 'MAQUINA', recurso: '', operarios: [], precio: '' }]);
                        } else {
                            setLoading(false);
                            return;
                        }
                    }
                    setIsLoaded(true);
                } catch (error) {
                    console.error("Error cargando:", error);
                    alert("Error al conectar con la base de datos.");
                } finally {
                    setLoading(false);
                }
            };

            // 3. Función: Agregar Nuevo Recurso (+)
            const handleAddResource = async (currentType) => {
                const newName = prompt(`INGRESAR NUEVA ${currentType}: \n(Ej: RECUBRIDORA-05, MESA DE CORTE 2)`);
                if (newName && newName.trim()) {
                    try {
                        await db.collection('settings_resources').add({
                            type: currentType,
                            name: newName.toUpperCase().trim(),
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert(`¡${newName.toUpperCase()} guardada! Ya puedes seleccionarla.`);
                    } catch (e) {
                        alert("Error al guardar recurso: " + e.message);
                    }
                }
            };

            // 4. Lógica de Autocompletado (Memoria)
            const handleDescriptionChange = (idx, value) => {
                const newProcs = [...processes];
                newProcs[idx].descripcion = value.toUpperCase();
                setProcesses(newProcs);

                if (value.length > 1) {
                    const matches = processLibrary.filter(p => p.descripcion.includes(value.toUpperCase()));
                    setSuggestions({ index: idx, items: matches });
                } else {
                    setSuggestions({ index: null, items: [] });
                }
            };

            const selectSuggestion = (idx, suggestion) => {
                const newProcs = [...processes];
                newProcs[idx] = {
                    ...newProcs[idx],
                    descripcion: suggestion.descripcion,
                    tipo: suggestion.tipo || 'MAQUINA',
                    recurso: suggestion.recurso || '', // Intenta recordar la máquina usada
                    precio: suggestion.precio || '',
                    operarios: suggestion.operarios || [] // Recuerda quiénes lo hicieron
                };
                setProcesses(newProcs);
                setSuggestions({ index: null, items: [] });
            };

            // 5. Lógica de Operarios Múltiples (Toggle)
            const toggleOperario = (idx, empName) => {
                const newProcs = [...processes];
                const currentOps = newProcs[idx].operarios || [];
                
                if (currentOps.includes(empName)) {
                    newProcs[idx].operarios = currentOps.filter(name => name !== empName);
                } else {
                    newProcs[idx].operarios = [...currentOps, empName];
                }
                setProcesses(newProcs);
            };

            // 6. Guardar Todo (Merge con Tejeduría)
            const handleSaveAll = async () => {
                if (!modelo) return;
                setLoading(true);
                try {
                    const cleanProcesses = processes.filter(p => p.descripcion.trim() !== "");

                    // A. Guardar en la Ficha del Modelo (MERGE: TRUE es vital para no borrar tejeduría)
                    await db.collection('model_templates').doc(modelo.toUpperCase()).set({
                        confection: cleanProcesses,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        // Nota: Si el documento no existe, crea uno nuevo. Si existe, solo actualiza/agrega 'confection'.
                    }, { merge: true });

                    // B. Guardar en la Memoria (Settings Processes)
                    const batch = db.batch();
                    cleanProcesses.forEach(proc => {
                        // ID del documento = Descripción saneada (ej: PEGAR-CUELLO)
                        const docId = proc.descripcion.trim().toUpperCase().replace(/\//g, '-').replace(/\s+/g, '-');
                        const ref = db.collection('settings_processes').doc(docId);
                        
                        batch.set(ref, {
                            descripcion: proc.descripcion,
                            tipo: proc.tipo,
                            recurso: proc.recurso,
                            precio: proc.precio,
                            operarios: proc.operarios, // Aprende quién sabe hacerlo
                            lastUsed: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                    });
                    await batch.commit();

                    alert("¡Ruta de Confección Guardada y Memorizada!");
                    // Opcional: setIsLoaded(false); setModelo(''); para reiniciar
                } catch (error) {
                    console.error(error);
                    alert("Error al guardar: " + error.message);
                } finally {
                    setLoading(false);
                }
            };

            // --- RENDERIZADO ---
            if (!isLoaded) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-900">
                        <div className="w-full max-w-md glass-panel p-8 rounded-2xl shadow-2xl border-t-4 border-pink-500 fade-in text-center">
                            <div className="mb-6 flex justify-center text-pink-500"><Icon name="scissors" size={48}/></div>
                            <h1 className="text-2xl font-black text-white mb-2">MÓDULO DE CONFECCIÓN</h1>
                            <p className="text-slate-400 text-sm mb-6">Ingresa el modelo para cargar o crear su ruta de costura.</p>
                            
                            <div className="flex gap-2">
                                <input 
                                    value={modelo} 
                                    onChange={e => setModelo(e.target.value.toUpperCase())} 
                                    onKeyDown={e => e.key === 'Enter' && loadModelData()}
                                    className="input-dark text-center text-lg" 
                                    placeholder="EJ: MODELO-2024"
                                    autoFocus
                                />
                                <button onClick={loadModelData} disabled={loading} className="bg-pink-600 hover:bg-pink-500 text-white p-3 rounded-lg shadow-lg disabled:opacity-50 transition-colors">
                                    {loading ? <Icon name="loader-2" className="animate-spin"/> : <Icon name="arrow-right"/>}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-900 pb-20 fade-in">
                    {/* Header Sticky */}
                    <div className="sticky top-0 z-20 bg-slate-900/90 backdrop-blur border-b border-pink-900/30 px-4 py-3 shadow-lg flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsLoaded(false)} className="text-slate-400 hover:text-white"><Icon name="arrow-left"/></button>
                            <div>
                                <h1 className="text-lg font-bold text-white flex gap-2 items-center"><span className="text-pink-500"><Icon name="shirt"/></span> {modelo}</h1>
                                <p className="text-[10px] text-pink-400 font-bold uppercase tracking-wider">Modo Confección</p>
                            </div>
                        </div>
                        <button onClick={handleSaveAll} disabled={loading} className="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white px-6 py-2 rounded-full font-bold text-sm shadow-lg shadow-pink-900/20 flex items-center gap-2 transition-transform active:scale-95">
                            {loading ? <Icon name="loader-2" className="animate-spin"/> : <Icon name="save"/>} 
                            <span className="hidden md:inline">GUARDAR FICHA</span>
                        </button>
                    </div>

                    <div className="max-w-5xl mx-auto p-4 space-y-6">
                        {/* Botón Agregar Proceso */}
                        <div className="flex justify-between items-end">
                            <h2 className="text-slate-400 text-xs font-bold uppercase tracking-widest">Secuencia de Operaciones</h2>
                            <button 
                                onClick={() => setProcesses([...processes, { descripcion: '', tipo: 'MAQUINA', recurso: '', operarios: [], precio: '' }])}
                                className="text-xs bg-slate-800 hover:bg-slate-700 text-pink-400 border border-pink-900/50 px-4 py-2 rounded-lg font-bold transition flex items-center gap-2"
                            >
                                <Icon name="plus" size={14}/> AGREGAR OPERACIÓN
                            </button>
                        </div>

                        {/* LISTA DE PROCESOS */}
                        <div className="space-y-4">
                            {processes.map((proc, idx) => (
                                <div key={idx} className="glass-panel p-4 rounded-xl relative group hover:border-pink-500/30 transition-colors">
                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
                                        
                                        {/* 1. Descripción + Autocomplete */}
                                        <div className="md:col-span-5 relative z-10">
                                            <label className="text-[10px] text-slate-500 font-bold mb-1 block">DESCRIPCIÓN DEL PROCESO</label>
                                            <div className="relative">
                                                <input 
                                                    value={proc.descripcion} 
                                                    onChange={e => handleDescriptionChange(idx, e.target.value)}
                                                    className="input-dark pl-9" 
                                                    placeholder="Ej: CERRAR COSTADOS"
                                                />
                                                <div className="absolute left-3 top-2.5 text-slate-500"><Icon name="search" size={14}/></div>
                                            </div>
                                            
                                            {/* Sugerencias Flotantes */}
                                            {suggestions.index === idx && suggestions.items.length > 0 && (
                                                <div className="absolute top-full left-0 w-full bg-slate-800 border border-slate-600 rounded-lg shadow-2xl mt-1 max-h-48 overflow-y-auto z-50">
                                                    {suggestions.items.map((item, i) => (
                                                        <div key={i} onClick={() => selectSuggestion(idx, item)} className="p-3 border-b border-slate-700 hover:bg-pink-900/20 cursor-pointer flex justify-between items-center group">
                                                            <div>
                                                                <div className="text-xs font-bold text-white">{item.descripcion}</div>
                                                                <div className="text-[10px] text-slate-400">{item.tipo} {item.recurso ? `• ${item.recurso}` : ''}</div>
                                                            </div>
                                                            <div className="text-xs font-mono text-pink-400 font-bold">${item.precio}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* 2. Categoría */}
                                        <div className="md:col-span-2">
                                            <label className="text-[10px] text-slate-500 font-bold mb-1 block">TIPO</label>
                                            <select 
                                                value={proc.tipo} 
                                                onChange={e => {
                                                    const n = [...processes]; 
                                                    n[idx].tipo = e.target.value; 
                                                    n[idx].recurso = ''; // Reset recurso al cambiar tipo
                                                    setProcesses(n);
                                                }} 
                                                className="input-dark cursor-pointer"
                                            >
                                                <option value="MAQUINA">MÁQUINA</option>
                                                <option value="MANUAL">MANUAL</option>
                                                <option value="PLANCHA">PLANCHA</option>
                                                <option value="CORTADOR">CORTADOR</option>
                                                <option value="OTROS">OTROS</option>
                                            </select>
                                        </div>

                                        {/* 3. Recurso + Botón ADD */}
                                        <div className="md:col-span-3">
                                            <label className="text-[10px] text-slate-500 font-bold mb-1 block">RECURSO ESPECÍFICO</label>
                                            <div className="flex gap-1 h-[38px]">
                                                <select 
                                                    value={proc.recurso} 
                                                    onChange={e => {
                                                        const n = [...processes]; n[idx].recurso = e.target.value; setProcesses(n);
                                                    }}
                                                    className="input-dark text-cyan-400 border-cyan-900/30 h-full"
                                                >
                                                    <option value="">-- GENERAL --</option>
                                                    {resources.filter(r => r.type === proc.tipo).map(r => (
                                                        <option key={r.id} value={r.name}>{r.name}</option>
                                                    ))}
                                                </select>
                                                <button 
                                                    onClick={() => handleAddResource(proc.tipo)}
                                                    className="bg-slate-800 hover:bg-cyan-600 text-cyan-400 hover:text-white border border-cyan-900/30 px-3 rounded-md transition-colors"
                                                    title="Crear nuevo recurso en base de datos"
                                                >
                                                    <Icon name="plus" size={16}/>
                                                </button>
                                            </div>
                                        </div>

                                        {/* 4. Precio */}
                                        <div className="md:col-span-2 relative">
                                            <label className="text-[10px] text-slate-500 font-bold mb-1 block">PRECIO</label>
                                            <input 
                                                type="number" 
                                                value={proc.precio} 
                                                onChange={e => {const n=[...processes]; n[idx].precio=e.target.value; setProcesses(n);}}
                                                className="input-dark text-right text-pink-400 font-mono pr-2" 
                                                placeholder="0.00"
                                            />
                                            <span className="absolute top-[28px] left-2 text-pink-900 text-xs">$</span>
                                        </div>
                                    </div>

                                    {/* 5. SELECCIÓN DE OPERARIOS (Multi-Select) */}
                                    <div className="bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Operarios Capaces ({proc.operarios?.length || 0})</label>
                                            <button onClick={() => setProcesses(processes.filter((_, i) => i !== idx))} className="text-red-900 hover:text-red-500 transition"><Icon name="trash-2" size={14}/></button>
                                        </div>
                                        
                                        <div className="flex flex-wrap gap-2">
                                            {employees.map(emp => {
                                                const isSelected = (proc.operarios || []).includes(emp.fullName);
                                                return (
                                                    <button 
                                                        key={emp.id}
                                                        onClick={() => toggleOperario(idx, emp.fullName)}
                                                        className={`
                                                            tag-btn flex items-center gap-1
                                                            ${isSelected 
                                                                ? 'bg-pink-600 border-pink-500 text-white shadow-lg shadow-pink-900/50' 
                                                                : 'bg-slate-900 border-slate-700 text-slate-500 hover:border-slate-500 hover:text-slate-300'}
                                                        `}
                                                    >
                                                        {isSelected && <Icon name="check" size={10}/>}
                                                        {emp.firstName}
                                                    </button>
                                                )
                                            })}
                                            {employees.length === 0 && <span className="text-[10px] text-slate-600 italic">No hay empleados activos en el sistema.</span>}
                                        </div>
                                    </div>

                                </div>
                            ))}
                        </div>

                        {/* Estado Vacío */}
                        {processes.length === 0 && (
                            <div className="text-center py-10 opacity-50">
                                <Icon name="scissors" size={48} className="mx-auto mb-2 text-slate-600"/>
                                <p className="text-slate-500">No hay procesos definidos para este modelo aún.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => <ConfectionManager />;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
