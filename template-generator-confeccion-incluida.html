<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Factory - Confección Inteligente V3.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0a0f1d; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .input-focus:focus { border-color: #818cf8; ring: 2px; ring-color: #4f46e5; outline: none; }
        .suggestion-box { z-index: 100; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const Icon = ({ name, size = 18, className }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        // --- COMPONENTE PRINCIPAL ---
        const ConfectionModule = () => {
            const [form, setForm] = useState({ modelo: '', cliente: '' });
            const [isExisting, setIsExisting] = useState(false); // Detecta si el modelo ya existe en DB
            const [processes, setProcesses] = useState([{ id: Date.now(), descripcion: '', tipo: 'MAQUINA', subRecurso: '', empleadosSugeridos: [], precio: '' }]);
            
            // Estados de Datos de DB
            const [employees, setEmployees] = useState([]);
            const [resources, setResources] = useState([]); // Maquinas y Otros
            const [processLibrary, setProcessLibrary] = useState([]); // Historial de procesos para autollanado
            const [suggestions, setSuggestions] = useState({ idx: null, items: [] });
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // Cargar Empleadas
                db.collection('confection_employees').where('status', '==', 'ACTIVE').onSnapshot(snap => {
                    setEmployees(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                // Cargar Recursos (Máquinas/Otros)
                db.collection('settings_resources').onSnapshot(snap => {
                    setResources(snap.docs.map(d => d.data()));
                });
                // Cargar Librería de Procesos (Histórico para autocompletar)
                db.collection('process_library').onSnapshot(snap => {
                    setProcessLibrary(snap.docs.map(d => d.data()));
                });
            }, []);

            // Verificar si el modelo existe al escribir
            useEffect(() => {
                const checkModel = async () => {
                    if (form.modelo.length < 2) { setIsExisting(false); return; }
                    const doc = await db.collection('model_templates').doc(form.modelo.toUpperCase()).get();
                    setIsExisting(doc.exists);
                };
                checkModel();
            }, [form.modelo]);

            // Función para agregar recurso (Máquina/Otro)
            const handleAddResource = async (type) => {
                const name = prompt(`Nombre de la nueva ${type}:`).toUpperCase();
                if (name) {
                    await db.collection('settings_resources').add({ type, name, createdAt: new Date() });
                }
            };

            // Autocompletado de Proceso
            const handleProcessInput = (idx, val) => {
                const newProcs = [...processes];
                newProcs[idx].descripcion = val.toUpperCase();
                setProcesses(newProcs);

                if (val.length > 2) {
                    const filtered = processLibrary.filter(p => p.descripcion.includes(val.toUpperCase()));
                    setSuggestions({ idx, items: filtered });
                } else {
                    setSuggestions({ idx: null, items: [] });
                }
            };

            const selectProcessSuggestion = (idx, item) => {
                const newProcs = [...processes];
                newProcs[idx] = { 
                    ...newProcs[idx], 
                    descripcion: item.descripcion,
                    tipo: item.tipo,
                    subRecurso: item.subRecurso,
                    precio: item.precio,
                    empleadosSugeridos: item.empleadosSugeridos || []
                };
                setProcesses(newProcs);
                setSuggestions({ idx: null, items: [] });
            };

            // Cargar Plantilla Existente
            const loadTemplate = async () => {
                const mod = prompt("Ingrese el nombre exacto del modelo:").toUpperCase();
                if (!mod) return;
                setLoading(true);
                const doc = await db.collection('model_templates').doc(mod).get();
                if (doc.exists) {
                    const data = doc.data();
                    setForm({ modelo: data.modelo, cliente: data.cliente });
                    setProcesses(data.confection || []);
                } else {
                    alert("No se encontró el modelo");
                }
                setLoading(false);
            };

            // Guardar con lógica de advertencia
            const saveTemplate = async () => {
                if (!form.modelo || !form.cliente) return alert("Faltan datos básicos");
                
                if (isExisting) {
                    const confirm = window.confirm(`¡ADVERTENCIA! El modelo ${form.modelo} ya existe. ¿Deseas SOBREESCRIBIR la información actual?`);
                    if (!confirm) return;
                }

                try {
                    // Guardar en la plantilla
                    await db.collection('model_templates').doc(form.modelo.toUpperCase()).set({
                        ...form,
                        confection: processes,
                        updatedAt: new Date()
                    }, { merge: true });

                    // "Aprender": Guardar procesos en la librería para el futuro
                    processes.forEach(async (p) => {
                        if (p.descripcion) {
                            await db.collection('process_library').doc(p.descripcion.replace(/\//g, '-')).set({
                                descripcion: p.descripcion,
                                tipo: p.tipo,
                                subRecurso: p.subRecurso,
                                precio: p.precio,
                                empleadosSugeridos: p.empleadosSugeridos
                            }, { merge: true });
                        }
                    });

                    alert("Plantilla guardada y procesos aprendidos con éxito.");
                } catch (e) { alert("Error: " + e.message); }
            };

            // Exportar CSV
            const exportCSV = async () => {
                const snap = await db.collection('model_templates').get();
                let csv = "Modelo,Cliente,Operacion,Tipo,Recurso,Precio,Personal Sugerido\n";
                
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.confection) {
                        data.confection.forEach(op => {
                            csv += `${data.modelo},${data.cliente},"${op.descripcion}",${op.tipo},${op.subRecurso},${op.precio},"${(op.empleadosSugeridos || []).join(' - ')}"\n`;
                        });
                    }
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `Produccion_Confeccion_2026.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    {/* Header y Acciones Globales */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h1 className="text-3xl font-black text-white flex items-center gap-3">
                                <Icon name="scissors" size={32} className="text-pink-500"/>
                                MÓDULO DE CONFECCIÓN
                            </h1>
                            <p className="text-slate-400 font-mono text-sm">CONTROL DE OPERACIONES Y COSTOS V3.0</p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={loadTemplate} className="flex-1 bg-slate-800 hover:bg-slate-700 p-2 px-4 rounded-lg border border-slate-600 flex items-center gap-2 text-sm font-bold">
                                <Icon name="folder-open" size={16}/> Abrir
                            </button>
                            <button onClick={exportCSV} className="flex-1 bg-emerald-900/40 hover:bg-emerald-800 text-emerald-400 p-2 px-4 rounded-lg border border-emerald-700 flex items-center gap-2 text-sm font-bold">
                                <Icon name="download" size={16}/> CSV
                            </button>
                        </div>
                    </div>

                    {/* Formulario Principal */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                        {/* Seccion 1: Identificación */}
                        <div className="p-6 border-b border-slate-800 bg-slate-800/30 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="relative">
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Modelo</label>
                                <input 
                                    value={form.modelo} 
                                    onChange={e => setForm({...form, modelo: e.target.value.toUpperCase()})}
                                    placeholder="EJ: SWEATER-V-2026"
                                    className={`w-full bg-slate-950 border ${isExisting ? 'border-orange-500 ring-1 ring-orange-500' : 'border-slate-700'} p-3 rounded-xl font-bold text-xl tracking-tight focus:border-indigo-500 outline-none transition-all`}
                                />
                                {isExisting && (
                                    <div className="absolute -bottom-6 left-0 text-[10px] text-orange-400 font-bold flex items-center gap-1">
                                        <Icon name="alert-triangle" size={12}/> ESTE MODELO YA EXISTE EN LA BASE DE DATOS
                                    </div>
                                )}
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Cliente</label>
                                <input 
                                    value={form.cliente} 
                                    onChange={e => setForm({...form, cliente: e.target.value.toUpperCase()})}
                                    placeholder="NOMBRE DEL CLIENTE..."
                                    className="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl font-bold text-xl focus:border-indigo-500 outline-none transition-all"
                                />
                            </div>
                        </div>

                        {/* Seccion 2: Operaciones */}
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold flex items-center gap-2 text-indigo-400">
                                    <Icon name="list-checks"/> Secuencia de Operaciones
                                </h2>
                                <button 
                                    onClick={() => setProcesses([...processes, { id: Date.now(), descripcion: '', tipo: 'MAQUINA', subRecurso: '', empleadosSugeridos: [], precio: '' }])}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-black shadow-lg shadow-indigo-900/20 flex items-center gap-2"
                                >
                                    <Icon name="plus" size={16}/> AÑADIR PROCESO
                                </button>
                            </div>

                            <div className="space-y-4">
                                {processes.map((proc, idx) => (
                                    <div key={proc.id} className="group bg-slate-800/40 border border-slate-700 p-4 rounded-xl hover:border-indigo-500/50 transition relative">
                                        <div className="grid grid-cols-12 gap-4 items-start">
                                            {/* Descripción con Sugerencias */}
                                            <div className="col-span-12 md:col-span-3 relative">
                                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Descripción del Proceso</label>
                                                <input 
                                                    value={proc.descripcion} 
                                                    onChange={e => handleProcessInput(idx, e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm font-semibold"
                                                    placeholder="Ej: Pegar Cuello..."
                                                />
                                                {suggestions.idx === idx && suggestions.items.length > 0 && (
                                                    <div className="absolute left-0 right-0 mt-1 bg-indigo-900 border border-indigo-400 rounded-lg shadow-2xl overflow-hidden z-[100]">
                                                        {suggestions.items.map((item, i) => (
                                                            <div 
                                                                key={i} 
                                                                onClick={() => selectProcessSuggestion(idx, item)}
                                                                className="p-2 hover:bg-indigo-700 cursor-pointer text-xs border-b border-indigo-800 last:border-0"
                                                            >
                                                                <div className="font-bold">{item.descripcion}</div>
                                                                <div className="text-[10px] opacity-70">{item.subRecurso} - ${item.precio}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Tipo y SubRecurso */}
                                            <div className="col-span-6 md:col-span-2">
                                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Categoría</label>
                                                <select 
                                                    value={proc.tipo} 
                                                    onChange={e => { const n = [...processes]; n[idx].tipo = e.target.value; setProcesses(n); }}
                                                    className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm"
                                                >
                                                    <option value="MAQUINA">MÁQUINA</option>
                                                    <option value="CORTADOR">CORTADOR</option>
                                                    <option value="MANUAL">MANUAL</option>
                                                    <option value="OTROS">OTROS</option>
                                                </select>
                                            </div>

                                            <div className="col-span-6 md:col-span-2">
                                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Recurso Específico</label>
                                                <div className="flex gap-1">
                                                    <select 
                                                        value={proc.subRecurso} 
                                                        onChange={e => { const n = [...processes]; n[idx].subRecurso = e.target.value; setProcesses(n); }}
                                                        className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-cyan-400 font-bold"
                                                    >
                                                        <option value="">-- SELECCIONE --</option>
                                                        {resources.filter(r => r.type === proc.tipo).map((r, i) => (
                                                            <option key={i} value={r.name}>{r.name}</option>
                                                        ))}
                                                    </select>
                                                    {(proc.tipo === 'MAQUINA' || proc.tipo === 'OTROS') && (
                                                        <button onClick={() => handleAddResource(proc.tipo)} className="p-2 bg-slate-700 rounded-lg hover:bg-indigo-600 transition">
                                                            <Icon name="plus" size={14}/>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Multi-selección de Empleadas */}
                                            <div className="col-span-12 md:col-span-3">
                                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Posibles Operarias</label>
                                                <div className="flex flex-wrap gap-1 p-2 bg-slate-900 border border-slate-700 rounded-lg min-h-[40px]">
                                                    {employees.map(emp => (
                                                        <button 
                                                            key={emp.id}
                                                            onClick={() => {
                                                                const n = [...processes];
                                                                const current = n[idx].empleadosSugeridos || [];
                                                                n[idx].empleadosSugeridos = current.includes(emp.fullName) 
                                                                    ? current.filter(e => e !== emp.fullName)
                                                                    : [...current, emp.fullName];
                                                                setProcesses(n);
                                                            }}
                                                            className={`text-[9px] px-2 py-1 rounded-full border transition ${
                                                                (proc.empleadosSugeridos || []).includes(emp.fullName)
                                                                ? 'bg-purple-600 border-purple-400 text-white'
                                                                : 'bg-slate-800 border-slate-600 text-slate-400 opacity-50'
                                                            }`}
                                                        >
                                                            {emp.fullName}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Precio y Borrar */}
                                            <div className="col-span-10 md:col-span-1">
                                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1 text-right">Precio</label>
                                                <input 
                                                    type="number" 
                                                    value={proc.precio} 
                                                    onChange={e => { const n = [...processes]; n[idx].precio = e.target.value; setProcesses(n); }}
                                                    className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-right text-pink-400 font-bold"
                                                    placeholder="0.00"
                                                />
                                            </div>

                                            <div className="col-span-2 md:col-span-1 flex justify-center pt-5">
                                                <button 
                                                    onClick={() => setProcesses(processes.filter(p => p.id !== proc.id))}
                                                    className="text-slate-600 hover:text-red-500 p-2"
                                                >
                                                    <Icon name="trash-2" size={20}/>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Footer de Guardado */}
                        <div className="bg-slate-800/50 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-xs font-mono text-slate-500 flex items-center gap-2">
                                <Icon name="info" size={14}/> Los procesos marcados se guardarán en la memoria inteligente para futuros modelos.
                            </div>
                            <button 
                                onClick={saveTemplate}
                                className="w-full md:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-12 py-4 rounded-xl font-black shadow-xl shadow-indigo-900/40 flex items-center justify-center gap-3 active:scale-95 transition-all"
                            >
                                <Icon name="save"/> {isExisting ? 'ACTUALIZAR PLANTILLA' : 'GUARDAR NUEVA PLANTILLA'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ConfectionModule />);
    </script>
</body>
</html>
