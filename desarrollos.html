<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Control - Pedidos y Desarrollos 2026 (Firebase)</title>
    <style>
        /* --- ESTILOS VISUALES (CSS) --- */
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; text-transform: uppercase; margin-bottom: 10px; }
        h1 { background-color: #000; color: #fff; padding: 10px; font-size: 24px; }
        h2 { font-size: 20px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        
        /* Botones */
        .controls { margin: 20px 0; text-align: center; padding: 15px; background: #e0e0e0; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #000; color: white; border: none; border-radius: 4px; margin: 0 5px; }
        button:hover { background-color: #333; }
        button.reset { background-color: #b30000; }
        button.save-modal { background-color: #007bff; }
        button.cancel-modal { background-color: #6c757d; }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
        th, td { border: 1px solid #ccc; padding: 5px; text-align: center; position: relative; }
        th { background-color: #eee; font-weight: bold; }
        thead th { background-color: #e0e0e0; }

        /* Inputs de la tabla (Ahora son readonly para activar el modal) */
        input.table-input { 
            width: 90%; border: none; text-align: center; background: transparent; font-size: 14px; cursor: pointer; color: #000; font-weight: 500;
        }
        input.table-input:hover { background-color: #eef; outline: 1px dashed #007bff; }
        input.table-input:focus { outline: none; }
        
        /* Indicador visual si hay notas */
        .has-notes::after {
            content: '★'; position: absolute; top: 0; right: 0; font-size: 10px; color: red;
        }

        /* Referencia de Meses */
        .reference-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .ref-box { border: 2px solid #000; padding: 10px; margin-bottom: 20px; }
        .month-row { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 5px 0; font-weight: bold; }
        .month-left { font-size: 18px; }
        .month-right { font-size: 18px; text-transform: uppercase; }

        /* Estilos del Resumen y Clientes */
        .summary-header th { background-color: #333; color: white; }
        .client-section { page-break-inside: avoid; margin-top: 40px; border: 2px solid #000; padding: 10px; }
        .client-title { background-color: #000; color: white; font-size: 28px; text-align: center; padding: 5px; margin-top: 0; }

        /* --- ESTILOS DEL MODAL --- */
        .modal-overlay {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 25px; border-radius: 8px; width: 400px; max-width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .modal-actions { text-align: right; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button onclick="addNewClientPrompt()">+ Agregar Nuevo Cliente</button>
        <p style="font-size: 12px; margin-top: 10px; color: #555;">🟢 Conectado a Base de Datos en Tiempo Real</p>
    </div>

    <div class="ref-box">
        <h1>PEDIDOS 2026</h1>
        <div style="text-align: center; font-size: 12px; margin-bottom: 10px;">
            OPTIMA - BELLAFORM - SHASA - CUIDADO CON EL PERRO - INTIMEDEA - TIENDAS VIVA ROUSS
        </div>
        <div id="referenceTable"></div>
    </div>

    <div class="ref-box">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#000; color:#fff; padding:5px;">
            <h2 style="margin:0; border:none; color:white;">Desarrollos 2026 Resumen General</h2>
        </div>
        <table id="summaryTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="clientsContainer"></div>
</div>

<div id="dataModal" class="modal-overlay">
    <div class="modal-content">
        <h2 id="modalTitle" style="border:none; text-align:left; font-size:18px;">Editar Celda</h2>
        <div class="form-group">
            <label for="modalValue">Valor (Número o Texto):</label>
            <input type="text" id="modalValue" placeholder="Escribe el valor aquí..." autofocus>
        </div>
        <div class="form-group">
            <label for="modalNotes">Observaciones / Detalles:</label>
            <textarea id="modalNotes" rows="4" placeholder="Agrega detalles extra si es necesario..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="cancel-modal" onclick="closeModal()">Cancelar</button>
            <button class="save-modal" onclick="saveModalData()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    // 1. IMPORTAR FIREBASE (Versión Modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // 2. CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
        authDomain: "cirineo-cec21.firebaseapp.com",
        projectId: "cirineo-cec21",
        storageBucket: "cirineo-cec21.firebasestorage.app",
        messagingSenderId: "620210618284",
        appId: "1:620210618284:web:482bab9bf74650fff18409"
    };

    // Inicializar
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables Globales
    let currentClients = ["Andrea", "OPTIMA"]; // Iniciales, luego se cargarán de BD
    let currentEditingId = null;

    // --- LÓGICA DE TABLAS ---
    const months = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
    const deliveryMap = { "ENERO": "ABRIL", "FEBRERO": "MAYO", "MARZO": "JUNIO", "ABRIL": "JULIO", "MAYO": "AGOSTO", "JUNIO": "SEPTIEMBRE", "JULIO": "OCTUBRE", "AGOSTO": "NOVIEMBRE", "SEPTIEMBRE": "DICIEMBRE", "OCTUBRE": "ENERO", "NOVIEMBRE": "FEBRERO", "DICIEMBRE": "MARZO" };

    // --- CARGA INICIAL ---
    window.addEventListener('DOMContentLoaded', () => {
        renderReferenceTable();
        listenToConfig(); // Escuchar cambios en la configuración (lista de clientes)
        listenToData();   // Escuchar cambios en los valores de las celdas
    });

    // --- FUNCIONES DE RENDERIZADO ---
    function renderReferenceTable() {
        const container = document.getElementById('referenceTable');
        let html = '';
        months.slice(0, 9).forEach(m => {
             html += `<div class="month-row">
                        <span style="font-size:12px; color:#555;">LOS DESARROLLOS DE</span>
                        <span class="month-left">${m}</span>
                        <span style="font-size:12px; color:#555;">SE REALIZAN EN</span>
                        <span class="month-right">${deliveryMap[m] || '...'}</span>
                      </div>`;
        });
        container.innerHTML = html;
    }

    function renderAllTables() {
        renderSummaryTable();
        renderClientTables();
    }

    // Tabla Resumen
    function renderSummaryTable() {
        const table = document.getElementById('summaryTable');
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');

        let headerHTML = `<tr class="summary-header">
                <th>Desarrollos</th><th>Propuesta</th><th>Días</th><th>Modif.</th><th>Semana</th>`;
        currentClients.forEach(client => { headerHTML += `<th>${client}</th>`; });
        headerHTML += `</tr>`;
        thead.innerHTML = headerHTML;

        let bodyHTML = '';
        months.forEach((month) => {
            bodyHTML += `<tr>
                <td><strong>${month}</strong></td>
                <td><input class="table-input" readonly id="sum_${month}_prop" onclick="window.openModal(this.id)"></td>
                <td><input class="table-input" readonly id="sum_${month}_dias" onclick="window.openModal(this.id)"></td>
                <td><input class="table-input" readonly id="sum_${month}_modif" onclick="window.openModal(this.id)"></td>
                <td><input class="table-input" readonly id="sum_${month}_sem" onclick="window.openModal(this.id)"></td>`;
            currentClients.forEach(client => {
                const id = `sum_${month}_${client.replace(/\s/g, '')}`;
                bodyHTML += `<td><input class="table-input" readonly id="${id}" onclick="window.openModal(this.id)"></td>`;
            });
            bodyHTML += `</tr>`;
        });
        tbody.innerHTML = bodyHTML;
    }

    // Tablas Clientes
    function renderClientTables() {
        const container = document.getElementById('clientsContainer');
        container.innerHTML = ''; 

        currentClients.forEach(client => {
            const cleanName = client.replace(/\s/g, '');
            let html = `<div class="client-section"><div class="client-title">Desarrollos 2026 <strong>${client}</strong></div>
                <table><thead><tr>
                    <th>Mes</th><th>Propuesta</th><th>Cantidad</th><th>Resurtidos</th>
                    <th>Prop.#1</th><th>Prop.#2</th><th>Prop.#3</th><th>Prop.#4</th><th>Prop.#5</th>
                </tr></thead><tbody>`;

            months.forEach(month => {
                html += `<tr>
                    <td><strong>${month}</strong></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_prop" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_cant" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_res" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_p1" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_p2" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_p3" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_p4" onclick="window.openModal(this.id)"></td>
                    <td><input class="table-input" readonly id="${cleanName}_${month}_p5" onclick="window.openModal(this.id)"></td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        });
    }

    // --- FIREBASE LISTENERS (TIEMPO REAL) ---

    // 1. Escuchar lista de clientes
    function listenToConfig() {
        const docRef = doc(db, "tablero_2026", "config_general");
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().clients) {
                currentClients = docSnap.data().clients;
            } else {
                // Si no existe configuración, creamos la inicial
                setDoc(docRef, { clients: currentClients });
            }
            renderAllTables();
            // Después de renderizar, volvemos a poblar los datos porque el HTML se reinició
            fetchCurrentData(); 
        });
    }

    // 2. Escuchar TODA la colección de celdas
    function listenToData() {
        const colRef = collection(db, "tablero_2026");
        onSnapshot(colRef, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added" || change.type === "modified") {
                    const data = change.doc.data();
                    const elementId = change.doc.id;
                    
                    // Solo intentar actualizar si no es la configuración general
                    if(elementId !== "config_general") {
                        updateDOMCell(elementId, data);
                    }
                }
            });
        });
    }

    // Función auxiliar para re-pintar datos si se recarga la estructura
    async function fetchCurrentData() {
        const colRef = collection(db, "tablero_2026");
        // Nota: En una app grande esto se optimizaría, pero para este tablero está bien leer todo.
        const querySnapshot = await import("https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js").then(mod => mod.getDocs(colRef));
        
        querySnapshot.forEach((doc) => {
            if(doc.id !== "config_general") {
                updateDOMCell(doc.id, doc.data());
            }
        });
    }

    function updateDOMCell(id, data) {
        const el = document.getElementById(id);
        if (el) {
            el.value = data.value || "";
            // Marcar visualmente si tiene notas
            const parentTd = el.parentElement;
            if (data.notes && data.notes.trim() !== "") {
                parentTd.classList.add('has-notes');
                el.title = "Notas: " + data.notes; // Tooltip nativo
            } else {
                parentTd.classList.remove('has-notes');
                el.title = "";
            }
        }
    }

    // --- MANEJO DEL MODAL ---

    // Exponer funciones al scope global window para que funcionen con onclick="" del HTML
    window.openModal = async function(id) {
        currentEditingId = id;
        const modal = document.getElementById('dataModal');
        const inputVal = document.getElementById('modalValue');
        const inputNotes = document.getElementById('modalNotes');
        const title = document.getElementById('modalTitle');

        // Limpiar inputs
        inputVal.value = "";
        inputNotes.value = "";
        title.innerText = "Editando: " + id.replace(/_/g, " ");

        // Intentar obtener datos actuales de Firebase para llenar el modal
        const docRef = doc(db, "tablero_2026", id);
        try {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                inputVal.value = data.value || "";
                inputNotes.value = data.notes || "";
            }
        } catch (e) {
            console.log("Celda nueva o error de lectura", e);
        }

        modal.style.display = "flex";
        inputVal.focus();
    }

    window.closeModal = function() {
        document.getElementById('dataModal').style.display = "none";
        currentEditingId = null;
    }

    window.saveModalData = async function() {
        if (!currentEditingId) return;

        const val = document.getElementById('modalValue').value;
        const notes = document.getElementById('modalNotes').value;

        // Guardar en Firestore
        const docRef = doc(db, "tablero_2026", currentEditingId);
        await setDoc(docRef, {
            value: val,
            notes: notes,
            lastUpdate: new Date()
        }, { merge: true });

        closeModal();
    }
    
    // Cerrar modal con tecla Escape y guardar con Enter
    document.addEventListener('keydown', function(event) {
        if(document.getElementById('dataModal').style.display === "flex") {
            if (event.key === "Escape") {
                window.closeModal();
            }
            if (event.key === "Enter" && !event.shiftKey) { // Permitir Enter en textarea con Shift
                event.preventDefault(); // Evitar salto de línea extra
                window.saveModalData();
            }
        }
    });

    // --- AGREGAR CLIENTE ---
    window.addNewClientPrompt = async function() {
        const name = prompt("Nombre del nuevo cliente (Ej: Shasa, Miss R):");
        if (name && name.trim() !== "") {
            if(currentClients.includes(name)){
                alert("Este cliente ya existe.");
                return;
            }
            
            // Actualizamos la lista local y enviamos a Firebase
            const newClients = [...currentClients, name];
            const docRef = doc(db, "tablero_2026", "config_general");
            await setDoc(docRef, { clients: newClients }, { merge: true });
            // El listener 'listenToConfig' se encargará de re-renderizar la UI
        }
    }

</script>

</body>
</html>
