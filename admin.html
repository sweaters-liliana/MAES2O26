const Icon = ({ name, size = 18, className }) => {
    const ref = React.useRef(null);
    React.useEffect(() => {
        if (ref.current && lucide.icons[name]) {
            ref.current.innerHTML = lucide.icons[name].toSvg({ width: size, height: size, class: className });

    }, [name, size, className]);

// ------------------------------------------------------------
// HOOK: ESCÁNER DE CÓDIGO DE BARRAS (GLOBAL)
// ------------------------------------------------------------
const useBarcodeScanner = (onScan) => {
    React.useEffect(() => {
        let buffer = '';
        let lastKeyTime = Date.now();
        const handleKeyDown = (e) => {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') return;
            const char = e.key;
            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 100) buffer = '';
            lastKeyTime = currentTime;
            if (char === 'Enter') {
                if (buffer.length > 5) onScan(buffer);
                buffer = '';
            } else if (char.length === 1) buffer += char;
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onScan]);
};

// ------------------------------------------------------------
// COMPONENTE DE INPUT DE TIEMPO (MM:SS)
// ------------------------------------------------------------
const TimeInput = ({ value, onChange, disabled }) => {
    const [mins, setMins] = React.useState('');
    const [secs, setSecs] = React.useState('');

    React.useEffect(() => {
        if (value === undefined || value === '' || value === null) {
            setMins(''); setSecs('');
        } else {
            const totalMins = parseFloat(value);
            const m = Math.floor(totalMins);
            const s = Math.round((totalMins - m) * 60);
            setMins(m.toString());
            setSecs(s < 10 ? '0' + s : s.toString());
        }
    }, [value]);

    const handleChange = (newM, newS) => {
        const m = parseInt(newM) || 0;
        const s = parseInt(newS) || 0;
        const decimalValue = (m + (s / 60)).toFixed(4);
        onChange(decimalValue);
    };

    return (
        <div className="flex items-center gap-1 bg-white border border-gray-300 rounded-md shadow-sm p-0.5 focus-within:ring-1 focus-within:ring-indigo-500 focus-within:border-indigo-500">
            <input type="number" value={mins} placeholder="00" disabled={disabled} onChange={(e) => { setMins(e.target.value); handleChange(e.target.value, secs); }} className="w-8 text-center p-1 text-sm font-mono outline-none rounded-l-md disabled:bg-gray-50" />
            <span className="font-bold text-gray-400 text-xs">:</span>
            <input type="number" value={secs} placeholder="00" max="59" disabled={disabled} onChange={(e) => { setSecs(e.target.value); handleChange(mins, e.target.value); }} className="w-8 text-center p-1 text-sm font-mono outline-none rounded-r-md disabled:bg-gray-50" />
        </div>
    );
};

// ------------------------------------------------------------
// COMPONENTE SMARTIMAGE (busca imagen en múltiples fuentes)
// ------------------------------------------------------------
const SmartImage = ({ repoUrls, codigo, className }) => {
    const [imgSrc, setImgSrc] = React.useState(null);
    const [attempt, setAttempt] = React.useState({ urlIndex: 0, extension: 'jpg' });
    React.useEffect(() => {
        if (!repoUrls || !repoUrls.length || !codigo) { setImgSrc(null); return; }
        setAttempt({ urlIndex: 0, extension: 'jpg' });
        const base = repoUrls[0].endsWith('/') ? repoUrls[0] : repoUrls[0] + '/';
        setImgSrc(`${base}${codigo}.jpg`);
    }, [repoUrls, codigo]);

    const handleError = () => {
        const { urlIndex, extension } = attempt;
        if (extension === 'jpg') {
            const base = repoUrls[urlIndex].endsWith('/') ? repoUrls[urlIndex] : repoUrls[urlIndex] + '/';
            setImgSrc(`${base}${codigo}.png`);
            setAttempt({ ...attempt, extension: 'png' });
        } else if (urlIndex < repoUrls.length - 1) {
            const nextIdx = urlIndex + 1;
            const base = repoUrls[nextIdx].endsWith('/') ? repoUrls[nextIdx] : repoUrls[nextIdx] + '/';
            setImgSrc(`${base}${codigo}.jpg`);
            setAttempt({ urlIndex: nextIdx, extension: 'jpg' });
        } else {
            setAttempt({ ...attempt, extension: 'fail' });
        }
    };
    if (attempt.extension === 'fail' || !imgSrc) return <div className={`bg-slate-100 flex flex-col items-center justify-center text-slate-300 ${className}`}><Icon name="image-off" size={32} className="mb-2"/><span className="text-[10px] text-center px-2">Sin img</span></div>;
    return <img src={imgSrc} onError={handleError} className={className} alt={codigo} />;
};

const generateSmartID = (partida, pieces, maquina) => {
    const piecePrefixes = pieces.map(p => p.pieza.substring(0, 2).toUpperCase()).join('/');
    return `${partida}-${piecePrefixes}-M${maquina}`;
};

// ------------------------------------------------------------
// BOTÓN DE INSTALACIÓN PWA
// ------------------------------------------------------------
const InstallButton = () => {
    const [deferredPrompt, setDeferredPrompt] = React.useState(null);
    React.useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
    }, []);
    const handleInstall = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') setDeferredPrompt(null);
    };
    if (!deferredPrompt) return null;
    return (
        <button onClick={handleInstall} className="bg-yellow-500 hover:bg-yellow-600 text-black px-3 py-2 rounded-md font-bold shadow-sm flex items-center gap-2 text-xs animate-pulse transition">
            <Icon name="download-cloud" size={16}/> <span className="hidden sm:inline">INSTALAR APP</span>
        </button>
    );
};

// COMPONENTE PRODUCTIONLABEL (extraído de papeletas.html)
// ------------------------------------------------------------
const ProductionLabel = ({ labelData, shiftHours, imageSources }) => {
    const svgRef = React.useRef(null);
    const order = labelData; 
    const subPiece = order.subPiecesData ? order.subPiecesData.find(sp => sp.pieza === order.piezaNombre) : (order.subPiecesData?.[0] || {});
    
    const barcodeValue = order.packageCode; 
    const fechaEntrega = order.fechaEntrega || new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toLocaleDateString('es-MX');

    // Cálculos matemáticos (sin decimales)
    const tiempo = parseFloat(subPiece?.tiempo);
    const hours = parseFloat(shiftHours) || 12;
    const pzas1hr = tiempo > 0 ? Math.round(60 / tiempo) : '-'; 
    const pzasShift = tiempo > 0 ? Math.round((hours * 60) / tiempo) : '-'; 

    // Limpieza de nombre de pieza (solo primera palabra)
    const rawPieza = order.piezaNombre || 'ESTANDAR';
    const piezaVisual = rawPieza.split(' ')[0]; 

    // Lógica de tamaño de fuente para "PIEZA"
    let piezaFontSize = '28px';
    if (piezaVisual.length <= 6) {
        piezaFontSize = '64px';
    } else if (piezaVisual.length <= 10) {
        piezaFontSize = '52px';
    } else {
        piezaFontSize = '38px';
    }

    // Gestión de Imagen Inteligente
    const [imgSrc, setImgSrc] = React.useState(null);
    const [currentSourceIdx, setCurrentSourceIdx] = React.useState(0);
    const [tryPng, setTryPng] = React.useState(false); 

    React.useEffect(() => {
        if(imageSources && imageSources.length > 0 && order.codigo) {
            setCurrentSourceIdx(0);
            setTryPng(false);
            setImgSrc(`${imageSources[0].url}/${order.codigo}.jpg`);
        } else {
            setImgSrc(null);
        }
    }, [order.codigo, imageSources]);

    const handleImgError = () => {
        if (!tryPng) {
            setTryPng(true);
            if(imageSources[currentSourceIdx]) {
                setImgSrc(`${imageSources[currentSourceIdx].url}/${order.codigo}.png`);
            }
            return;
        }
        const nextIdx = currentSourceIdx + 1;
        if (nextIdx < imageSources.length) {
            setCurrentSourceIdx(nextIdx);
            setTryPng(false); 
            setImgSrc(`${imageSources[nextIdx].url}/${order.codigo}.jpg`);
        } else {
            setImgSrc(null); 
        }
    };

    // Barcode
    React.useEffect(() => {
        if (svgRef.current && barcodeValue) {
            try {
                JsBarcode(svgRef.current, barcodeValue, { 
                    format: "CODE128", lineColor: "#000", width: 1.6, height: 55, displayValue: false, margin: 3
                });
            } catch (e) { console.error("Error barcode", e); }
        }
    }, [barcodeValue]);

    return (
        <div className="label-layout">

                    <img src={imgSrc} onError={handleImgError} alt={order.codigo}/>

                    <div className="flex flex-col items-center justify-center h-full">
                        <div className="text-slate-300 text-xs text-center font-bold">SIN<br/>IMAGEN</div>
                    </div>
                )}
            </div>

            {/* ZONA 2: DATOS (CENTRO) */}
            <div className="col-data">
                {/* Fila 1 */}
                <div className="lbl-row" style={{height: '17%'}}>
                    <div className="lbl-col" style={{width: '65%'}}>
                        <div className="lbl-title">MODELO</div>
                        <div className="lbl-big">{order.codigo || 'S/N'}</div>
                    </div>
                    <div className="lbl-col" style={{width: '35%'}}>
                        <div className="lbl-title">TOTAL ORDEN</div>
                        <div className="lbl-medium">{order.totalPedido || 0}</div>
                    </div>
                </div>
                
                {/* Fila 2 */}
                <div className="lbl-row" style={{height: '13%'}}>
                    <div className="lbl-col" style={{width: '70%'}}>
                        <div className="lbl-title">CLIENTE</div>
                        <div className="lbl-std truncate">{order.cliente || '---'}</div>
                    </div>
                    <div className="lbl-col" style={{width: '30%'}}>
                        <div className="lbl-title">PARTIDA</div>
                        <div className="lbl-std">{order.partida || '-'}</div>
                    </div>
                </div>

                {/* Fila 3: PIEZA LIMPIA Y CENTRADA */}
                <div className="lbl-row" style={{height: '24%', backgroundColor: '#000', color: '#FFF'}}>
                    <div className="lbl-col" style={{
                        width: '100%', 
                        border: 'none', 
                        alignItems: 'center', 
                        justifyContent: 'center',
                        padding: '0',
                        display: 'flex' 
                    }}>
                        <span style={{
                            fontFamily: "'Oswald', sans-serif",
                            fontWeight: '700',
                            fontSize: piezaFontSize, 
                            lineHeight: '1',
                            textAlign: 'center',

                            whiteSpace: 'nowrap',
                            overflow: 'hidden',
                            textOverflow: 'ellipsis'

    }, []);

    if (!order || !order.progreso) return null;

        packageCode: p.codigoUnico,
        displayPackageId: `${p.paqueteNum}/${p.paquetesDePieza}`
    }));

    const handleDownloadPDF = async () => {

        };

            setIsGenerating(false);
        }).catch(err => {
            console.error("PDF Error:", err);
            setIsGenerating(false);
            alert("Error al generar PDF.");

    return (
        <div className="fixed inset-0 bg-black/70 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
            <div className="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">

                            </div>
                            <div className="flex flex-col sm:flex-row gap-4 items-center justify-center mt-4">

// VISOR DE EXCEL FLOTANTE (para plantillas)
// ------------------------------------------------------------
const FloatingExcelViewer = ({ worksheet, fileName, onClose }) => {
    const [winState, setWinState] = React.useState(() => {
        const isMobile = window.innerWidth < 768;
        return { x: isMobile ? 10 : 50, y: isMobile ? 60 : 80, w: isMobile ? window.innerWidth - 20 : 600, h: isMobile ? 300 : 400 };
    });
    const [zoom, setZoom] = React.useState(() => window.innerWidth < 768 ? 0.55 : 0.85); 
    const [isDragging, setIsDragging] = React.useState(false);
    const [isResizing, setIsResizing] = React.useState(false);
    const dragRef = React.useRef({ startX: 0, startY: 0, initialX: 0, initialY: 0, initialW: 0, initialH: 0 });

    const startDrag = (clientX, clientY) => { setIsDragging(true); dragRef.current = { startX: clientX, startY: clientY, initialX: winState.x, initialY: winState.y }; };
    const startResize = (clientX, clientY, e) => { e.stopPropagation(); setIsResizing(true); dragRef.current = { startX: clientX, startY: clientY, initialW: winState.w, initialH: winState.h }; };

    React.useEffect(() => {
        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            if (isDragging) {
                const dx = clientX - dragRef.current.startX;
                const dy = clientY - dragRef.current.startY;
                setWinState(prev => ({ ...prev, x: dragRef.current.initialX + dx, y: dragRef.current.initialY + dy }));
            }
            if (isResizing) {
                const dx = clientX - dragRef.current.startX;
                const dy = clientY - dragRef.current.startY;
                setWinState(prev => ({ ...prev, w: Math.max(200, dragRef.current.initialW + dx), h: Math.max(150, dragRef.current.initialH + dy) }));
            }
        };
        const handleUp = () => { setIsDragging(false); setIsResizing(false); };
        if (isDragging || isResizing) {
            window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleUp);
            window.addEventListener('touchmove', handleMove); window.addEventListener('touchend', handleUp);
        }
        return () => {
            window.removeEventListener('mousemove', handleMove); window.removeEventListener('mouseup', handleUp);
            window.removeEventListener('touchmove', handleMove); window.removeEventListener('touchend', handleUp);
        };
    }, [isDragging, isResizing]);

    const grid = React.useMemo(() => {
        if (!worksheet) return null;
        const range = XLSX.utils.decode_range(worksheet['!ref']);
        const merges = worksheet['!merges'] || [];
        const rowsInfo = worksheet['!rows'] || [];
        const colsInfo = worksheet['!cols'] || [];
        const mergeMap = {};

        merges.forEach(merge => {
            const {s, e} = merge;
            if (!mergeMap[s.r]) mergeMap[s.r] = {};
            mergeMap[s.r][s.c] = { rowSpan: e.r - s.r + 1, colSpan: e.c - s.c + 1, hidden: false };
            for(let r = s.r; r <= e.r; r++) {
                for(let c = s.c; c <= e.c; c++) {
                    if (r === s.r && c === s.c) continue;
                    if (!mergeMap[r]) mergeMap[r] = {};
                    mergeMap[r][c] = { hidden: true };
                }
            }
        });

        const rows = [];
        for (let R = range.s.r; R <= range.e.r; R++) {
            const cells = [];
            const rowHeight = `${(rowsInfo[R] ? rowsInfo[R].hpx : 20) * zoom}px`; 
            for (let C = range.s.c; C <= range.e.c; C++) {
                const mergeData = mergeMap[R] && mergeMap[R][C];
                if (mergeData && mergeData.hidden) continue;
                const cellAddress = XLSX.utils.encode_cell({c: C, r: R});
                const cell = worksheet[cellAddress];
                const colWidth = `${(colsInfo[C] ? colsInfo[C].wpx : 42) * zoom}px`;
                cells.push({
                    key: `${R}-${C}`, value: cell ? (cell.w || cell.v || "") : "",
                    rowSpan: mergeData ? mergeData.rowSpan : 1, colSpan: mergeData ? mergeData.colSpan : 1,
                    width: colWidth, isBold: (cell?.s?.font?.bold) || (R < 1), align: cell?.s?.alignment?.horizontal || 'left'
                });
            }
            rows.push({ index: R, cells, height: rowHeight });
        }
        return rows;
    }, [worksheet, zoom]);

    if (!grid) return null;

    return (
        <div className={`floating-window ${isDragging ? 'dragging' : ''}`} style={{ left: winState.x, top: winState.y, width: winState.w, height: winState.h }}>
            <div className="bg-slate-800 px-3 py-2 flex justify-between items-center border-b border-slate-600 cursor-move select-none"
                onMouseDown={(e) => startDrag(e.clientX, e.clientY)} onTouchStart={(e) => startDrag(e.touches[0].clientX, e.touches[0].clientY)}>
                <div className="flex items-center gap-2 overflow-hidden mr-2"><div className="text-emerald-400"><Icon name="file-spreadsheet" size={18}/></div><span className="font-bold text-xs text-slate-200 truncate uppercase">{fileName}</span></div>
                <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => setZoom(z => Math.max(z-0.1, 0.3))} className="p-1 text-slate-400 hover:text-white"><Icon name="zoom-out" size={14}/></button>
                    <span className="text-[10px] text-slate-500">{Math.round(zoom*100)}%</span>
                    <button onClick={() => setZoom(z => Math.min(z+0.1, 2.0))} className="p-1 text-slate-400 hover:text-white"><Icon name="zoom-in" size={14}/></button>
                    <button onClick={onClose} className="text-red-400 hover:bg-red-900/30 p-1 rounded ml-2"><Icon name="x" size={16}/></button>
                </div>
            </div>
            <div className="flex-grow overflow-auto bg-white relative">
                 <div className="excel-viewer-container p-2 min-w-min">
                     <table className="excel-table shadow-sm" style={{ fontSize: `${11 * zoom}pt` }}>
                         <tbody>{grid.map((row) => (<tr key={row.index} style={{ height: row.height }}><td className="bg-slate-100 text-slate-400 select-none text-center border-slate-300" style={{ width: `${30 * zoom}px`, fontSize: `${9 * zoom}pt` }}>{row.index + 1}</td>{row.cells.map((cell) => (<td key={cell.key} colSpan={cell.colSpan} rowSpan={cell.rowSpan} style={{ width: cell.width, minWidth: cell.width, maxWidth: cell.width, fontWeight: cell.isBold ? 'bold' : 'normal', textAlign: cell.align }}>{cell.value}</td>))}</tr>))}</tbody>
                     </table>
                 </div>
            </div>
            <div className="resize-handle bg-slate-700 hover:bg-emerald-500 transition-colors rounded-tl-lg" onMouseDown={(e) => startResize(e.clientX, e.clientY, e)} onTouchStart={(e) => startResize(e.touches[0].clientX, e.touches[0].clientY, e)}><Icon name="move-diagonal-2" size={16} className="text-white"/></div>
        </div>
    );
};

    const [threading, setThreading] = React.useState([{ guia: 1, material: '', porcentaje: '', materialId: null }]);
    const [inventory, setInventory] = React.useState([]);
    const [suggestions, setSuggestions] = React.useState({ index: null, items: [] });
    const [excelFile, setExcelFile] = React.useState(null); 
    const [isLoadingExcel, setIsLoadingExcel] = React.useState(false);
    const [excelError, setExcelError] = React.useState(null);

    // GITHUB_CONFIG
    const GITHUB_CONFIG = { owner: 'sweaters-liliana', repo: 'MAES2O26', path: 'Fichas' };

    const fetchExcelFromGitHub = async (modelName) => {
        if (!modelName) throw new Error("Ingresa un modelo");
        const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
        try {
            const listResponse = await fetch(apiUrl);
            if (!listResponse.ok) throw new Error("No se pudo acceder al repositorio");
            const files = await listResponse.json();
            const targetFile = files.find(f => f.name.toLowerCase().includes(modelName.toLowerCase()) && f.name.endsWith('.xlsx'));
            if (!targetFile) throw new Error(`No se encontró ficha para "${modelName}"`);
            const fileResponse = await fetch(targetFile.download_url);
            const blob = await fileResponse.blob();
            const arrayBuffer = await blob.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer);
            const firstSheetName = workbook.SheetNames[0];
            return { fileName: targetFile.name, worksheet: workbook.Sheets[firstSheetName] };
        } catch (error) { console.error(error); throw error; }
    };

    // LEER INVENTARIO REAL
    React.useEffect(() => {
        const unsubscribe = db.collection('inventory').doc('main').onSnapshot(doc => { 
            if (doc.exists && doc.data().items) setInventory(doc.data().items); 
        });
        return () => unsubscribe();
    }, []);

    const handleSearchExcel = async () => {
        if(!form.modelo) return alert("Escribe un modelo primero");

            const filtered = inventory.filter(i => `${i.material} ${i.color}`.toLowerCase().includes(val.toLowerCase())); 
            setSuggestions({ index: idx, items: filtered }); 
        } else { setSuggestions({ index: null, items: [] }); }

    const selectSuggestion = (idx, item) => { 
        const newThreads = [...threading]; 
        newThreads[idx] = { ...newThreads[idx], material: `${item.material} - ${item.color}`, materialId: item.id }; 
        setThreading(newThreads); setSuggestions({ index: null, items: [] });

// MODAL DE AGRUPADOR DE KITS (extraído de agrupador.html)

const KitMakerModal = ({ onClose }) => {
    const [orders, setOrders] = React.useState([]);
    const [selectedKey, setSelectedKey] = React.useState(null);
    const [checkedIds, setCheckedIds] = React.useState([]);
    const [kitQueue, setKitQueue] = React.useState([]);
    const [repos, setRepos] = React.useState([]);
    const [isSaving, setIsSaving] = React.useState(false);
    
    // Estado para Desagrupar
    const [isUngroupMode, setIsUngroupMode] = React.useState(false);
    const [pendingUngroups, setPendingUngroups] = React.useState([]);

    const pdfRef = React.useRef();

    React.useEffect(() => {
        db.collection('app_config').doc('imagenes').onSnapshot(d => setRepos(d.data()?.sources || []));
        return db.collection('orders').where('status','!=','ARCHIVADO').onSnapshot(s => {
            setOrders(s.docs.map(doc => ({...doc.data(), id: doc.id})));
        });
    }, []);

    const currentData = React.useMemo(() => {
        if(!selectedKey) return null;
        const [mod, part] = selectedKey.split('|');
        const pkgs = [];
        orders.filter(o => o.codigo === mod && (o.partida || 'SN') === part).forEach(o => {
            if(o.progreso) {
                const cliente = o.cliente || 'S/C';
                const subPieces = o.subPiecesData || [];
                o.progreso.forEach(p => {
                    const meta = subPieces.find(sp => sp.pieza === p.piezaNombre) || subPieces[0] || {};
                    pkgs.push({ ...p, orderId: o.id, maquina: p.maquina || o.maquina || 'S/M', cliente, talla: meta.talla || 'U', partida: o.partida });
                });
            }
        });
        const groupedBySize = pkgs.reduce((acc, p) => {
            if (!acc[p.talla]) acc[p.talla] = [];
            acc[p.talla].push(p);
            return acc;
        }, {});
        return { 
            modelo: mod, partida: part, 
            sizes: Object.keys(groupedBySize).sort().map(s => ({ name: s, items: groupedBySize[s].sort((a,b) => a.paqueteNum - b.paqueteNum) }))
        };
    }, [selectedKey, orders]);

    const selectedPieces = React.useMemo(() => {
        if(!currentData) return [];
        const all = [];
        currentData.sizes.forEach(s => all.push(...s.items));
        return all.filter(p => checkedIds.includes(p.codigoUnico));
    }, [checkedIds, currentData]);

    const activeSizeLock = React.useMemo(() => {
        if (isUngroupMode) return null;
        if (kitQueue.length > 0) return kitQueue[0].talla;
        if (selectedPieces.length > 0) return selectedPieces[0].talla;
        return null;
    }, [kitQueue, selectedPieces, isUngroupMode]);

    const toggleUngroupMode = () => {
        if (isUngroupMode) {
            setIsUngroupMode(false);
            setPendingUngroups([]);
        } else {
            setCheckedIds([]);
            setIsUngroupMode(true);
        }
    };

    const handleCardClick = (p, grouped, selected) => {
        if (isUngroupMode) {
            if (p.kitRef) {
                const isPending = pendingUngroups.includes(p.kitRef);
                if (isPending) {
                    setPendingUngroups(prev => prev.filter(k => k !== p.kitRef));
                } else {
                    setPendingUngroups(prev => [...prev, p.kitRef]);
                }
            }
        } else {
            if(!grouped) {
                setCheckedIds(prev => selected ? prev.filter(x=>x!==p.codigoUnico) : [...prev, p.codigoUnico]);
            }
        }
    };

    const confirmUngroup = async () => {
        if (pendingUngroups.length === 0) {
            setIsUngroupMode(false);
            return;
        }
        setIsSaving(true);
        try {
            const batch = db.batch();
            pendingUngroups.forEach(kitId => {
                batch.delete(db.collection('kits_datos').doc(kitId));
            });
            const affectedOrders = new Set();
            orders.forEach(o => {
                if (o.progreso && o.progreso.some(p => pendingUngroups.includes(p.kitRef))) {
                    affectedOrders.add(o.id);
                }
            });
            affectedOrders.forEach(oid => {
                const orderObj = orders.find(o => o.id === oid);
                const newProg = orderObj.progreso.map(i => {
                    if (i.kitRef && pendingUngroups.includes(i.kitRef)) {
                        const { agrupado, kitRef, ...rest } = i;
                        return rest; 
                    }
                    return i;
                });
                batch.update(db.collection('orders').doc(oid), { progreso: newProg });
            });
            await batch.commit();
            setPendingUngroups([]);
            setIsUngroupMode(false);
        } catch (e) {
            alert("Error al desagrupar: " + e.message);
        }
        setIsSaving(false);
    };

    const handleConfirmManual = async () => {
        if (selectedPieces.length === 0) return;
        setIsSaving(true);
        const kitId = `K${Date.now().toString().slice(-8)}`;
        
        try {
            await db.collection('kits_datos').doc(kitId).set({
                kitId,
                modelo: currentData.modelo,
                partida: currentData.partida,

                    codigoUnico: p.codigoUnico,

                    piezaNombre: p.piezaNombre,
                    orderId: p.orderId,
                    maquinaOriginal: p.maquina
                }))
            });

            const batch = db.batch();
            const uniqueOrders = [...new Set(selectedPieces.map(p => p.orderId))];
            uniqueOrders.forEach(oid => {
                const orderObj = orders.find(o => o.id === oid);
                const newProg = orderObj.progreso.map(i => 
                    selectedPieces.some(sp => sp.codigoUnico === i.codigoUnico) ? {...i, agrupado: true, kitRef: kitId} : i
                );
                batch.update(db.collection('orders').doc(oid), { progreso: newProg });
            });
            await batch.commit();

            setKitQueue(prev => [...prev, {
                kitId,
                modelo: currentData.modelo,
                partida: currentData.partida,
                cliente: selectedPieces[0].cliente,
                talla: selectedPieces[0].talla,
                items: [...selectedPieces]

            setTimeout(() => {
                JsBarcode(`#bc-${kitId}`, kitId, {
                    format: "CODE128", displayValue: true, fontSize: 14, height: 50, margin: 0

            setCheckedIds([]);

        setIsSaving(false);

    const downloadPDF = async () => {
        if (kitQueue.length === 0) return;

        const opt = { 
            margin: 0, filename: `KITS_${currentData.modelo}.pdf`,

            html2canvas: { scale: 3, useCORS: true },

        setKitQueue([]);

    return (
        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-2 sm:p-4 backdrop-blur-sm">

                    <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="layers" className="text-indigo-400"/> AGRUPADOR DE KITS</h2>
                    <button onClick={onClose} className="text-slate-400 hover:text-white p-2"><Icon name="x" size={20}/></button>
                </div>
                
                <div className="flex flex-1 min-h-0">
                    {/* Sidebar izquierda: lista de partidas */}
                    <div className="w-64 bg-slate-900/30 border-r border-slate-700 overflow-y-auto p-3">
                        <h3 className="text-xs font-bold text-slate-400 uppercase mb-3">Órdenes activas</h3>
                        {Array.from(new Set(orders.map(o => `${o.codigo}|${o.partida || 'SN'}`))).sort().map(k => (
                            <div key={k} onClick={() => { if(!isSaving) { setSelectedKey(k); setKitQueue([]); setCheckedIds([]); setIsUngroupMode(false); setPendingUngroups([]); }}}
                                className={`p-3 rounded-lg cursor-pointer border-l-4 transition-all mb-2 ${selectedKey === k ? 'bg-indigo-900/50 border-indigo-400' : 'hover:bg-slate-700 border-transparent'}`}>
                                <div className="font-bold text-white">{k.split('|')[0]}</div>

                            </div>
                        ))}
                    </div>

                    {/* Contenido central: paquetes */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {selectedKey ? (
                            <div className="flex h-full">
                                <div className="flex-1 p-4 overflow-y-auto">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-2xl font-black text-white">{currentData?.modelo}</h3>
                                        <div className="flex gap-2">
                                            {!isUngroupMode && (
                                                <button onClick={toggleUngroupMode} className="bg-slate-700 hover:bg-red-900/50 text-slate-300 hover:text-red-300 px-3 py-1.5 rounded text-sm font-bold flex items-center gap-2">
                                                    <Icon name="unlock" size={16}/> DESAGRUPAR

                                            {kitQueue.length > 0 && !isUngroupMode && (
                                                <button onClick={downloadPDF} className="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm font-bold flex items-center gap-2">
                                                    <Icon name="file-down" size={16}/> PDF ({kitQueue.length})
                                                </button>

                                    {isUngroupMode && (

                                            <Icon name="alert-triangle" className="text-red-500"/> Modo desagrupar: selecciona kits (marcados en rojo) para romper el grupo.
                                        </div>

                                    {currentData?.sizes.map(s => (
                                        <div key={s.name} className={`mb-6 ${activeSizeLock && activeSizeLock !== s.name ? 'section-blocked' : ''}`}>
                                            <div className="group-header">Talla: {s.name}</div>

                                                    if (displaySelected) cardClass += 'selected ';
                                                    if (isUngroupMode) {
                                                        if (displayGrouped) cardClass += 'ungroup-target ';
                                                    } else {
                                                        if (displayGrouped) cardClass += 'confirmed ';
                                                    }

                                                    return (
                                                        <div key={p.codigoUnico} 
                                                            onClick={() => handleCardClick(p, isGroupedBase, displaySelected)}
                                                            className={cardClass}>
                                                            <div className="flex justify-between">
                                                                <span className="text-xl txt-oswald">#{p.paqueteNum}</span>
                                                                {displayGrouped && !isUngroupMode && <Icon name="lock" className="text-green-500" />}

                                                            </div>
                                                            <div className="mt-2 flex justify-between items-end">

                                                                <span className="text-2xl font-black text-yellow-500">{p.cantidad}</span>
                                                            </div>
                                                        </div>

                                            </div>

                                <div className="w-80 border-l border-slate-700 bg-slate-900/30 p-4 flex flex-col">

                                                {isSaving ? 'PROCESANDO...' : 'CONFIRMAR CAMBIOS'}

                                            <button onClick={toggleUngroupMode} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg">CANCELAR</button>

                                                        <span className="text-xl font-bold">{currentData.partida}</span>
